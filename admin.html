<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10243a"><title>Admin | FOUNDATIONS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="style.css">
<style>
.lg{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,#0b1b2d,#10243a 55%,#0f6f78)}
.lg .card{width:100%;max-width:400px}.lg h1{font-size:22px;font-weight:900;text-align:center;direction:ltr;letter-spacing:2px}.lg p{text-align:center;color:var(--mut);font-size:13px;margin:6px 0 18px;line-height:1.9}
.err{color:#c62839;font-size:13px;font-weight:700;min-height:20px;text-align:center;margin-top:8px}
.top{background:var(--ink);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top b{font-size:16px}.top small{display:block;color:#9fd6da;font-size:11px}
.top a,.top button{color:#fff;background:#ffffff1c;border:0;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px;border:1px solid var(--line);border-right:5px solid var(--teal);border-radius:14px;margin-bottom:10px;background:#fff}
.row.v{border-right-color:#7a5cc0}.row h3{font-size:15px}.row p{font-size:12px;color:var(--mut);margin-top:3px;overflow-wrap:anywhere;white-space:pre-wrap}
.act{display:flex;gap:6px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:600px){.g2{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stats div{background:#fff;border-radius:14px;padding:14px;text-align:center;border:1px solid #eef2f6}.stats b{font-size:22px;display:block}.stats small{font-size:11px;color:var(--mut)}
.mh{color:#fff;border-radius:18px;padding:18px;margin-bottom:14px}
.lr{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px}.lr small{display:block;color:var(--mut);font-size:10px}
.rbox{margin-top:10px;width:100%}.rbox textarea{min-height:70px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-size:13px;font-weight:700;z-index:300;display:none;max-width:92%;text-align:center}
#toast.bad{background:#b3202f}
</style></head><body>
<div id="toast"></div>
<div class="lg" id="login"><form class="card" id="lf">
  <h1>FOUNDATIONS ADMIN</h1><p>اكتب اسمك الثلاثي وكلمة المرور. اسمك بيتسجل في سجل المشرفين فقط ولا يظهر للطلاب.</p>
  <div class="field"><label>الاسم الثلاثي</label><input id="nmI" required maxlength="60"></div>
  <div class="field"><label>كلمة المرور</label><input id="pwI" type="password" required></div>
  <button class="btn" style="width:100%" id="lb">دخول</button><div class="err" id="le"></div>
</form></div>

<div id="app" class="hidden">
  <div class="top"><div><b>لوحة الإدارة</b><small id="who"></small></div><div style="display:flex;gap:6px"><a href="index.html">الموقع</a><button id="out">خروج</button></div></div>
  <main class="wrap">
    <div class="seg" id="mainSeg"><button class="on" data-v="lec">المحاضرات</button><button data-v="sug">الاقتراحات</button><button data-v="log">السجل</button></div>

    <section class="v" id="v-lec">
      <div class="stats"><div><b id="s1">0</b><small>محاضرات</small></div><div><b id="s2">0</b><small>عملي</small></div><div><b id="s3">0</b><small>نظري</small></div></div>
      <div class="seg" id="trSeg"><button class="on" data-t="practical">العملي</button><button data-t="theory">النظري</button></div>
      <button class="btn" id="newL" style="width:100%;margin-bottom:14px"><i class="fa-solid fa-plus"></i> محاضرة جديدة</button>
      <form class="card hidden" id="lf2" style="margin-bottom:14px">
        <input type="hidden" id="lid">
        <div class="g2">
          <div class="field"><label>النوع</label><select id="ltr"><option value="practical">عملي</option><option value="theory">نظري</option></select></div>
          <div class="field"><label>الحالة</label><select id="lst"><option value="published">منشورة</option><option value="draft">مسودة</option></select></div>
          <div class="field"><label>الاسم بالإنجليزية</label><input id="lt" required></div>
          <div class="field"><label>الاسم بالعربية</label><input id="lta" required></div>
          <div class="field"><label>المادة</label><input id="lsu" required value="Fundamentals of Nursing"></div>
          <div class="field"><label>المستوى</label><select id="llv"><option>First Year</option><option>Second Year</option><option>Third Year</option><option>Fourth Year</option></select></div>
        </div>
        <div class="field"><label>الوصف</label><textarea id="lds"></textarea></div>
        <div style="display:flex;gap:8px"><button class="btn" id="lsv">حفظ</button><button class="btn ghost" type="button" id="lcn">إلغاء</button></div>
      </form>
      <div id="lecs"></div>
    </section>

    <section class="v hidden" id="v-man">
      <button class="btn ghost sm" id="back"><i class="fa-solid fa-arrow-right"></i> رجوع</button>
      <div class="mh" id="mh" style="margin-top:12px"><h2 id="mt" style="font-size:19px"></h2><p id="mi" style="font-size:12px;opacity:.9;margin-top:4px"></p></div>
      <div class="seg" id="tabs"></div>
      <form class="card" id="cf" style="margin-bottom:14px">
        <input type="hidden" id="cid">
        <div class="h2" id="cft" style="font-size:16px"></div>
        <div class="field"><label>العنوان</label><input id="ct" required></div>
        <div class="field"><label>الوصف</label><textarea id="cd"></textarea></div>
        <div class="field"><label>الملف (حتى 20 ميجا)</label><input id="cfile" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.jpg,.jpeg,.png,.webp,.mp4,.mp3,.txt,.html,.htm"><small id="cur" style="color:#80621c"></small></div>
        <div style="display:flex;gap:8px"><button class="btn" id="csv">حفظ المحتوى</button><button class="btn ghost" type="button" id="ccn">مسح</button></div>
      </form>
      <div id="cl"></div>
    </section>

    <section class="v hidden" id="v-sug"><div class="h2"><i class="fa-solid fa-comments"></i> اقتراحات الطلاب</div><div id="sgl"></div></section>
    <section class="v hidden" id="v-log"><div class="h2"><i class="fa-solid fa-shield-halved"></i> سجل المشرفين</div><div class="card" id="lgl"></div></section>
  </main>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbzAkny0ZeMMNTDTxx9Tjw5dvXQO-oe_K1TyYrRjSnkt5acZXD1bgYZFU4E7ODl42QDZpQ/exec";
const SEC={explanation:["الشرح","fa-book-open"],skills:["المهارات العملية","fa-stethoscope"],checklists:["قائمة التحقق","fa-clipboard-check"],quizzes:["الاختبار","fa-brain"]};
const TH={explanation:["شرح وملخصات","fa-book-open"],quizzes:["كويز","fa-brain"]};
const EXT=["pdf","doc","docx","ppt","pptx","jpg","jpeg","png","webp","mp4","mp3","txt","html","htm"];
const $=i=>document.getElementById(i);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
let PW=sessionStorage.getItem("NPH_PW")||"",AD=sessionStorage.getItem("NPH_ADMIN")||"",L=[],track="practical",sel=null,tab="explanation";
const trk=l=>l&&l.track==="theory"?"theory":"practical";
const cur=()=>L.find(x=>String(x.id)===String(sel));
let tt;function toast(m,bad){const t=$("toast");t.textContent=m;t.className=bad?"bad":"";t.style.display="block";clearTimeout(tt);tt=setTimeout(()=>t.style.display="none",bad?5000:2800)}
function busy(on){document.querySelectorAll("button.btn").forEach(b=>b.disabled=on)}
const net=e=>e.message==="Failed to fetch"?"تعذر الاتصال. تأكد من النت.":e.message;
async function api(action,p){const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action,password:PW,adminName:AD},p||{}))});const d=await r.json();if(!d.ok)throw new Error(d.error||"خطأ");return d}
const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=()=>no(new Error("تعذر قراءة الملف"));r.readAsDataURL(f)});
const ext=n=>(n.split(".").pop()||"").toLowerCase();

$("lf").onsubmit=async e=>{e.preventDefault();$("le").textContent="";
  const w=$("nmI").value.replace(/\s+/g," ").trim().split(" ").filter(Boolean);
  if(w.length<3||!w.every(x=>/^[\u0600-\u06FFa-zA-Z]{2,}$/.test(x))){$("le").textContent="اكتب الاسم ثلاثي بحروف فقط.";return}
  PW=$("pwI").value;AD=w.join(" ");$("lb").disabled=true;
  try{await api("ping");sessionStorage.setItem("NPH_PW",PW);sessionStorage.setItem("NPH_ADMIN",AD);$("pwI").value="";await start()}
  catch(er){PW="";AD="";$("le").textContent=er.message==="Failed to fetch"?"تعذر الاتصال بالسيرفر.":"كلمة المرور غير صحيحة."}
  $("lb").disabled=false};
$("out").onclick=()=>{sessionStorage.clear();location.reload()};
async function start(){try{L=(await api("adminList")).lectures||[];$("login").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=AD;view("lec");renderL()}catch(e){toast(net(e),true);$("login").classList.remove("hidden");$("app").classList.add("hidden")}}

function view(v){document.querySelectorAll(".v").forEach(s=>s.classList.add("hidden"));$("v-"+v).classList.remove("hidden");
  document.querySelectorAll("#mainSeg button").forEach(b=>b.classList.toggle("on",b.dataset.v===v||(v==="man"&&b.dataset.v==="lec")));
  if(v==="sug")loadSug();if(v==="log")loadLog();scrollTo({top:0})}
document.querySelectorAll("#mainSeg button").forEach(b=>b.onclick=()=>view(b.dataset.v));
document.querySelectorAll("#trSeg button").forEach(b=>b.onclick=()=>{track=b.dataset.t;document.querySelectorAll("#trSeg button").forEach(x=>x.classList.toggle("on",x===b));renderL()});

function renderL(){const b=$("lecs");b.innerHTML="";
  $("s1").textContent=L.length;$("s2").textContent=L.filter(l=>trk(l)==="practical").length;$("s3").textContent=L.filter(l=>trk(l)==="theory").length;
  const m=L.filter(l=>trk(l)===track);if(!m.length)b.appendChild(el("div","empty","مفيش محاضرات في القسم ده."));
  m.forEach(l=>{const r=el("div","row"+(track==="theory"?" v":""));const i=el("div");
    i.append(el("h3","",(l.titleAr||"")+" | "+l.title),el("p","",l.subject+" - "+l.level));
    i.appendChild(el("span","pill"+(l.status==="published"?"":" gold"),l.status==="published"?"منشورة":"مسودة"));
    const a=el("div","act");
    const o=el("button","btn sm","المحتوى");o.onclick=()=>openL(l.id);
    const e=el("button","btn ghost sm","تعديل");e.onclick=()=>editL(l);
    const d=el("button","btn red sm","حذف");d.onclick=()=>delL(l.id);
    a.append(o,e,d);r.append(i,a);b.appendChild(r)})}
function lform(show){$("lf2").classList.toggle("hidden",!show)}
$("newL").onclick=()=>{$("lf2").reset();$("lid").value="";$("ltr").value=track;lform(true)};
$("lcn").onclick=()=>lform(false);
function editL(l){$("lid").value=l.id;$("ltr").value=trk(l);$("lst").value=l.status;$("lt").value=l.title;$("lta").value=l.titleAr;$("lsu").value=l.subject;$("llv").value=l.level;$("lds").value=l.description||"";lform(true);scrollTo({top:0,behavior:"smooth"})}
$("lf2").onsubmit=async e=>{e.preventDefault();
  const lec={id:$("lid").value||(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2)),title:$("lt").value.trim(),titleAr:$("lta").value.trim(),subject:$("lsu").value.trim(),level:$("llv").value,description:$("lds").value.trim(),status:$("lst").value,track:$("ltr").value};
  busy(true);try{await api("saveLecture",{lecture:lec});const i=L.findIndex(x=>String(x.id)===String(lec.id));
    if(i<0)L.push(Object.assign({},lec,{sections:{explanation:[],skills:[],checklists:[],quizzes:[]}}));else L[i]=Object.assign({},L[i],lec);
    track=lec.track;document.querySelectorAll("#trSeg button").forEach(x=>x.classList.toggle("on",x.dataset.t===track));
    lform(false);renderL();toast("تم الحفظ.")}catch(er){toast(net(er),true)}busy(false)};
async function delL(id){if(!confirm("حذف المحاضرة وكل ملفاتها نهائيًا؟"))return;busy(true);
  try{await api("deleteLecture",{id});L=L.filter(x=>String(x.id)!==String(id));renderL();toast("تم الحذف.")}catch(e){toast(net(e),true)}busy(false)}

function openL(id){sel=id;const l=cur(),th=trk(l)==="theory";
  $("mt").textContent=(l.titleAr||"")+" | "+l.title;$("mi").textContent=(th?"نظري":"عملي")+" - "+l.subject;
  $("mh").style.background=th?"linear-gradient(135deg,#3b2f6b,#7a5cc0)":"linear-gradient(135deg,#0a5c6a,#2fb8b4)";
  const S=th?TH:SEC;$("tabs").innerHTML="";Object.keys(S).forEach(k=>{const b=el("button","",S[k][0]);b.dataset.k=k;b.onclick=()=>sw(k);$("tabs").appendChild(b)});
  view("man");sw("explanation")}
$("back").onclick=()=>{view("lec");renderL()};
function sw(k){tab=k;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));rform();renderC()}
function rform(){$("cf").reset();$("cid").value="";$("cur").textContent="";$("cft").textContent="إضافة محتوى"}
$("ccn").onclick=rform;
$("cf").onsubmit=async e=>{e.preventDefault();const l=cur(),f=$("cfile").files[0];
  if(f){if(!EXT.includes(ext(f.name))){toast("نوع الملف غير مدعوم.",true);return}if(f.size>20*1048576){toast("الملف أكبر من 20 ميجا.",true);return}}
  busy(true);toast(f?"جاري رفع الملف... لا تغلق الصفحة.":"جاري الحفظ...");
  try{const item={id:$("cid").value,lectureId:l.id,section:tab,title:$("ct").value.trim(),description:$("cd").value.trim()};
    if(f)item.file={name:f.name,type:f.type||"application/octet-stream",data:await b64(f)};
    const s=(await api("saveItem",{item})).item;const a=l.sections[tab],i=a.findIndex(x=>String(x.id)===String(s.id));if(i<0)a.push(s);else a[i]=s;
    rform();renderC();toast("تم الحفظ.")}catch(er){toast(net(er),true)}busy(false)};
function renderC(){const l=cur(),b=$("cl");b.innerHTML="";const A=(l.sections&&l.sections[tab])||[];
  if(!A.length){b.appendChild(el("div","empty","مفيش محتوى في القسم ده."));return}
  A.forEach(it=>{const r=el("div","row"+(trk(l)==="theory"?" v":""));const i=el("div");i.appendChild(el("h3","",it.title));
    if(it.description)i.appendChild(el("p","",it.description));if(it.file)i.appendChild(el("span","pill",it.file.name));
    const a=el("div","act");
    if(it.file){const o=el("a","btn ghost sm","فتح");o.href=["html","htm"].includes(ext(it.file.name))?"view.html?f="+encodeURIComponent(it.file.id):"https://drive.google.com/file/d/"+it.file.id+"/view";o.target="_blank";a.appendChild(o)}
    const e=el("button","btn ghost sm","تعديل");e.onclick=()=>{$("cid").value=it.id;$("ct").value=it.title;$("cd").value=it.description||"";$("cur").textContent=it.file?"الملف الحالي: "+it.file.name+" (اتركه فارغًا للاحتفاظ به)":"";$("cft").textContent="تعديل محتوى";scrollTo({top:0,behavior:"smooth"})};
    const d=el("button","btn red sm","حذف");d.onclick=async()=>{if(!confirm("حذف المحتوى وملفه؟"))return;busy(true);try{await api("deleteItem",{id:it.id});l.sections[tab]=l.sections[tab].filter(x=>String(x.id)!==String(it.id));renderC();toast("تم الحذف.")}catch(er){toast(net(er),true)}busy(false)};
    a.append(e,d);r.append(i,a);b.appendChild(r)})}

async function loadSug(){const b=$("sgl");b.innerHTML="";b.appendChild(el("div","empty","جاري التحميل..."));
  try{const S=(await api("adminSuggestions")).suggestions||[];b.innerHTML="";
    if(!S.length){b.appendChild(el("div","empty","مفيش اقتراحات لسه."));return}
    S.forEach(s=>{const c=el("div","card");c.style.marginBottom="12px";
      const t=el("div");t.style.cssText="display:flex;justify-content:space-between;align-items:center;gap:8px";
      t.append(el("span","pill",s.type||"اقتراح"),el("small"," "+(s.name||"طالب")+" - "+(isNaN(new Date(s.time))?"":new Date(s.time).toLocaleString("ar-EG"))));
      const p=el("p","",s.message);p.style.cssText="margin:10px 0;line-height:2;white-space:pre-wrap;overflow-wrap:anywhere";
      const ta=el("textarea");ta.className="rbox";ta.placeholder="اكتب ردك هنا (بيظهر للطلاب باسم: الإدارة)";ta.value=s.reply||"";
      const a=el("div","act");a.style.marginTop="8px";
      const sd=el("button","btn sm",s.reply?"تحديث الرد":"إرسال الرد");
      sd.onclick=async()=>{if(!ta.value.trim()){toast("اكتب الرد الأول.",true);return}busy(true);try{await api("replySuggestion",{id:s.id,reply:ta.value.trim()});toast("تم إرسال الرد.");loadSug()}catch(er){toast(net(er),true)}busy(false)};
      const dl=el("button","btn red sm","حذف");dl.onclick=async()=>{if(!confirm("حذف الاقتراح؟"))return;busy(true);try{await api("deleteSuggestion",{id:s.id});loadSug()}catch(er){toast(net(er),true)}busy(false)};
      a.append(sd,dl);c.append(t,p,ta,a);b.appendChild(c)})
  }catch(e){b.innerHTML="";b.appendChild(el("div","empty","الاقتراحات غير مفعّلة في السكريبت. حدّث Google Apps Script."))}}

async function loadLog(){const b=$("lgl");b.innerHTML="";
  try{const g=(await api("adminLog")).log||[];if(!g.length){b.appendChild(el("div","empty","السجل فارغ."));return}
    g.slice(0,60).forEach(r=>{const d=el("div","lr");const i=el("div");i.appendChild(el("b","",r.name||"مجهول"));i.appendChild(document.createTextNode(" "+(r.action||"")+(r.detail?" - "+r.detail:"")));
      i.appendChild(el("small","",isNaN(new Date(r.time))?"":new Date(r.time).toLocaleString("ar-EG")));d.appendChild(i);b.appendChild(d)})
  }catch(e){b.appendChild(el("div","empty","السجل غير مفعّل."))}}

if(PW&&AD)start();
</script></body></html>
