<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06101f"><title>Admin | FOUNDATIONS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="style.css">
<style>

.lgc h1{text-align:center;font-family:Cinzel,serif;font-size:24px;font-weight:900;letter-spacing:3px;direction:ltr}

.err{color:#c0283a;font-size:13px;font-weight:700;min-height:20px;text-align:center;margin-top:10px}
.top{position:relative;background:linear-gradient(135deg,#06101f,#0b2540 60%,#0d3a52);color:#fff;padding:18px 16px 76px;overflow:hidden}
.top::before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(53,198,192,.25),transparent 70%);top:-160px;left:-80px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),var(--gold),transparent)}
.top-in{position:relative;z-index:1;max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tl{display:flex;align-items:center;gap:13px}
.gb{width:48px;height:48px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:21px;color:#3a2a05;background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 8px 20px rgba(212,175,90,.4),inset 0 0 0 2px rgba(255,255,255,.35)}
.tl .cap{display:block;font-family:Cinzel,serif;font-size:10px;letter-spacing:3px;color:var(--gold2);font-weight:700;direction:ltr;text-align:right}

.tb{display:flex;gap:8px;padding:5px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:16px}
.tbtn{display:inline-flex;align-items:center;gap:8px;color:#e6eef6;background:transparent;border:0;border-radius:12px;padding:10px 15px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;transition:.2s}
.tbtn:hover{background:rgba(255,255,255,.12)}
.tbtn.out{background:rgba(226,59,78,.2);color:#ffb9c0}
.main{max-width:1100px;margin:-44px auto 0;padding:0 16px 120px}
.tabbar{display:flex;gap:6px;background:#fff;border-radius:22px;padding:6px;box-shadow:var(--sh2);margin-bottom:18px;position:relative;z-index:5}
.tabbar button{flex:1;border:0;background:none;padding:11px 6px;border-radius:16px;font-weight:800;font-size:12.5px;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;font-family:inherit;transition:.2s}

@media(max-width:760px){.tabbar{position:fixed;bottom:10px;left:10px;right:10px;margin:0;z-index:90;border-radius:24px;box-shadow:0 14px 40px rgba(8,23,43,.4)}.fab{bottom:98px!important}.toast{bottom:104px}.tb{width:100%;justify-content:stretch}.tbtn{flex:1;justify-content:center}}
.fab{position:fixed;left:18px;bottom:26px;z-index:80;height:58px;padding:0 24px;border-radius:30px;border:0;color:#fff;font-weight:900;font-size:15px;font-family:inherit;background:linear-gradient(135deg,var(--teal),var(--teal2));box-shadow:0 14px 30px rgba(14,143,148,.5);display:flex;gap:10px;align-items:center;cursor:pointer}

.gr>*{position:relative}.gr small{color:var(--gold2);font-weight:700;font-size:12px}.gr h2{font-size:clamp(20px,5vw,26px);font-weight:900}.gr p{font-size:13px;color:#cfe0ea}
.grn{width:60px;height:60px;border-radius:20px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:26px;flex:none}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:16px}
.st{background:#fff;border-radius:22px;padding:16px;display:flex;gap:12px;align-items:center;box-shadow:var(--sh)}
.st .si{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:#fff;font-size:20px;flex:none}
.st b{display:block;font-size:24px;font-weight:900;line-height:1.2}.st small{font-size:12px;color:var(--mut);font-weight:700}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.qa button{display:flex;align-items:center;gap:12px;padding:16px;border-radius:20px;border:0;color:#fff;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;text-align:right;box-shadow:var(--sh);transition:.2s}
.qa button:hover{transform:translateY(-3px)}

.blk{background:#fff;border-radius:24px;padding:20px;box-shadow:var(--sh);margin-bottom:16px}

.mini:last-child{border:0}
.fl{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:12px}

.lr{background:#fff;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--sh);border-right:6px solid var(--teal);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lr.th{border-right-color:var(--vio)}
.lr .ic2{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:21px;flex:none;background:linear-gradient(135deg,#0e8f94,#35c6c0)}
.lr.th .ic2{background:linear-gradient(135deg,#6b4fb3,#9a7fe0)}
.mv{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.mvb{width:40px;height:34px;border:1.5px solid var(--line);background:#fff;border-radius:11px;cursor:pointer;color:var(--ink2);font-size:14px;transition:.2s}
.mvb:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.mvb:disabled{opacity:.3;cursor:default;background:#fff;color:var(--ink2);border-color:var(--line)}
.mn{font-weight:900;font-size:15px;color:var(--ac)}
.inf{flex:1;min-width:200px}.inf h3{font-size:16px;font-weight:800;line-height:1.55}
.inf .sb2{font-size:12px;color:var(--mut);direction:ltr;text-align:right}
.inf .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.act{display:flex;gap:6px;flex-wrap:wrap}
.mh{color:#fff;border-radius:26px;padding:22px;margin:14px 0;background:linear-gradient(135deg,#08617a,#0e8f94 60%,#35c6c0);box-shadow:var(--sh2)}
.mh.th{background:linear-gradient(135deg,#2c2266,#6b4fb3 60%,#9a7fe0)}
.mh h2{font-size:20px;font-weight:900;line-height:1.5}.mh p{font-size:13px;opacity:.92;margin-top:4px}
.tabs2{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.tabs2 button{display:flex;align-items:center;gap:8px;white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:11px 16px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink2)}
.tabs2 button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs2 em{font-style:normal;background:#eef2f6;color:var(--ink2);border-radius:10px;min-width:22px;height:22px;display:grid;place-items:center;font-size:11px;padding:0 6px}
.tabs2 button.on em{background:rgba(255,255,255,.2);color:#fff}
.tsel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.topt{border:2px solid var(--line);background:#f8fafc;border-radius:20px;padding:16px 10px;text-align:center;cursor:pointer;font-family:inherit;color:var(--ink);transition:.2s}
.topt i{display:block;font-size:24px;margin-bottom:6px}.topt b{display:block;font-size:16px}.topt small{display:block;font-size:11px;color:var(--mut);line-height:1.6;margin-top:2px}
.topt.practical i{color:var(--teal)}.topt.theory i{color:var(--vio)}
.topt.practical.on{border-color:var(--teal);background:#e4f5f5}.topt.theory.on{border-color:var(--vio);background:#eee9fa}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:560px){.g2{grid-template-columns:1fr}}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:24px 14px;border:2px dashed #b9c8d6;border-radius:22px;background:#f8fbfd;text-align:center;cursor:pointer;transition:.2s}
.drop:hover{border-color:var(--teal);background:#eefafa}
.drop i{font-size:34px;color:var(--teal)}.drop .dn{font-weight:800;font-size:14px;overflow-wrap:anywhere}.drop small{color:var(--mut);font-size:11.5px}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sh-h h3{font-size:19px;font-weight:900}
.sh-h button{width:38px;height:38px;border-radius:50%;border:0;background:#eef2f6;cursor:pointer;font-size:15px}
.sgc{background:#fff;border-radius:24px;padding:18px;box-shadow:var(--sh);margin-bottom:14px;border-right:6px solid #e9a23b}
.sgc.done{border-right-color:#17a05d}
.sgc .hh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.sgc .hh b{font-size:14.5px}.sgc .hh small{color:var(--mut);font-size:12px}
.sgc .msg{font-size:15.5px;line-height:2.1;white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f9fb;border-radius:16px;padding:12px 14px}
.sgc textarea{margin-top:12px;min-height:90px}
.tlg{position:relative;padding-right:22px}
.tlg::before{content:"";position:absolute;right:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.lg2{position:relative;padding:8px 0 14px}
.lg2::before{content:"";position:absolute;right:-22px;top:14px;width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid var(--teal)}
.lg2 b{font-size:14px}.lg2 span{font-size:13px;color:#475569;display:block}.lg2 small{font-size:11px;color:var(--mut)}
</style></head><body>
<div class="toast" id="toast"></div>
<div class="busy" id="busy"><div><div class="spin"></div><p id="busyMsg" style="font-weight:800"></p></div></div>

<div class="lgx" id="login"><form class="lgc" id="lf">
  <div class="mk"><i class="fa-solid fa-user-doctor"></i></div>
  <h1>FOUNDATIONS</h1><p>لوحة إدارة المنصة. اكتب اسمك الثلاثي وكلمة المرور. اسمك بيتسجل في سجل المشرفين فقط ولا يظهر للطلاب.</p>
  <div class="field"><label>الاسم الثلاثي</label><input id="nmI" required maxlength="60" placeholder="اسمك واسم الأب واسم الجد"></div>
  <div class="field"><label>كلمة المرور</label><input id="pwI" type="password" required></div>
  <button class="btn full lg" id="lb"><i class="fa-solid fa-key"></i> دخول</button><div class="err" id="le"></div>
</form></div>

<div id="app" class="hidden">
  <header class="top"><div class="top-in">
    <div class="tl">
      <div class="gb"><i class="fa-solid fa-user-doctor"></i></div>
      <div><span class="cap">ADMIN PANEL</span><b>لوحة الإدارة</b><span class="who" id="who"></span></div>
    </div>
    <div class="tb">
      <a class="tbtn" href="index.html"><i class="fa-solid fa-house"></i> الموقع</a>
      <button class="tbtn out" id="out" type="button"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
    </div>
  </div></header>
  <main class="main">
    <nav class="tabbar">
      <button data-v="dash" class="on"><i class="fa-solid fa-chart-pie"></i>الرئيسية</button>
      <button data-v="lec"><i class="fa-solid fa-layer-group"></i>المحاضرات</button>
      <button data-v="sug"><i class="fa-solid fa-comments"></i>الرسائل<span class="bdg hidden" id="bdg">0</span></button>
      <button data-v="log"><i class="fa-solid fa-clock-rotate-left"></i>السجل</button>
    </nav>
    <section id="v-dash"></section>
    <section id="v-lec" class="hidden">
      <div class="fl"><input id="fq" placeholder="دوّر على محاضرة..."><span class="pill gray" id="lcnt" style="align-self:center"></span></div>
      <div class="seg" id="trSeg"><button class="on" data-t="all">الكل</button><button data-t="practical">العملي</button><button data-t="theory">النظري</button></div>
      <div class="chips" id="stSeg"><button class="chip on" data-s="all">كل الحالات</button><button class="chip" data-s="published">منشورة</button><button class="chip" data-s="draft">مسودة</button></div>
      <div id="lecs"></div>
    </section>
    <section id="v-man" class="hidden"></section>
    <section id="v-sug" class="hidden">
      <div class="sect"><i class="fa-solid fa-comments"></i><div>رسائل الطلاب<small>الرد بيظهر للطلاب باسم "الإدارة" فقط</small></div></div>
      <div class="chips" id="sgFl"></div>
      <div id="sgl"></div>
    </section>
    <section id="v-log" class="hidden"><div class="sect"><i class="fa-solid fa-shield-halved"></i><div>سجل المشرفين<small>آخر العمليات على المنصة</small></div></div><div class="card" id="lgl"></div></section>
  </main>
  <button class="fab hidden" id="fab"><i class="fa-solid fa-plus"></i><span id="fabT"></span></button>
</div>
<div class="ov" id="ov"><div class="sheet" id="sh"></div></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbzAkny0ZeMMNTDTxx9Tjw5dvXQO-oe_K1TyYrRjSnkt5acZXD1bgYZFU4E7ODl42QDZpQ/exec";
const SEC={explanation:["الشرح","fa-book-open"],skills:["المهارات العملية","fa-hand-holding-medical"],checklists:["الشيك ليست","fa-clipboard-check"],quizzes:["الكويزات","fa-brain"]};
const TH={explanation:["شرح وملخصات","fa-book-open"],quizzes:["كويز","fa-brain"]};
const EXT=["pdf","doc","docx","ppt","pptx","jpg","jpeg","png","webp","mp4","mp3","txt","html","htm"];
const ACC="."+EXT.join(",.");
const $=i=>document.getElementById(i);
function ap(e,c){if(c==null||c===false)return;if(Array.isArray(c)){c.forEach(x=>ap(e,x));return}e.appendChild(c.nodeType?c:document.createTextNode(String(c)))}
function h(t,a){const e=document.createElement(t);if(a)for(const k in a){const v=a[k];if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k==="style")e.style.cssText=v;else if(k==="value")e.value=v;else if(k.slice(0,2)==="on")e[k]=v;else e.setAttribute(k,v===true?"":v)}
  for(let i=2;i<arguments.length;i++)ap(e,arguments[i]);return e}
function ic(n){return h("i",{class:"fa-solid "+n})}
function ago(t){const d=new Date(t);if(isNaN(d))return"";const m=Math.floor((Date.now()-d)/60000);if(m<1)return"الآن";if(m<60)return"منذ "+m+" دقيقة";const hr=Math.floor(m/60);if(hr<24)return"منذ "+hr+" ساعة";const dy=Math.floor(hr/24);if(dy<30)return"منذ "+dy+" يوم";return d.toLocaleDateString("ar-EG")}
function parseSg(s){let m=String(s.message||""),t=s.type||"اقتراح";const x=m.match(/^\[استفسار\]\s*/);if(x){t="استفسار";m=m.slice(x[0].length)}return{type:t,message:m}}
const fmt=b=>b>=1048576?(b/1048576).toFixed(2)+" MB":(b/1024).toFixed(1)+" KB";
const ext=n=>(n.split(".").pop()||"").toLowerCase();
function fic(n){const e=ext(n);if(e==="pdf")return"fa-file-pdf";if(["doc","docx"].includes(e))return"fa-file-word";if(["ppt","pptx"].includes(e))return"fa-file-powerpoint";if(["jpg","jpeg","png","webp"].includes(e))return"fa-file-image";if(e==="mp4")return"fa-file-video";if(e==="mp3")return"fa-file-audio";if(["html","htm"].includes(e))return"fa-file-code";return"fa-file-lines"}
const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=()=>no(new Error("تعذر قراءة الملف"));r.readAsDataURL(f)});
const net=e=>e.message==="Failed to fetch"?"تعذر الاتصال. تأكد من النت.":e.message;

let PW=sessionStorage.getItem("NPH_PW")||"",AD=sessionStorage.getItem("NPH_ADMIN")||"";
let L=[],SG=[],LG=[],V="dash",fTr="all",fSt="all",fq="",sel=null,tab="explanation",sgf="all",moving=false;
const trk=l=>l&&l.track==="theory"?"theory":"practical";
const isTh=l=>trk(l)==="theory";
const cur=()=>L.find(x=>String(x.id)===String(sel));
const secs=l=>isTh(l)?TH:SEC;
const cnt=(l,k)=>((l.sections&&l.sections[k])||[]).length;
const total=l=>Object.keys(l.sections||{}).reduce((n,k)=>n+cnt(l,k),0);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2);

let tt;function toast(m,bad){const t=$("toast");t.textContent=m;t.className="toast show"+(bad?" bad":"");clearTimeout(tt);tt=setTimeout(()=>t.className="toast",bad?5000:2800)}
function busy(on,msg){$("busy").classList.toggle("show",!!on);$("busyMsg").textContent=msg||"جاري التنفيذ..."}
async function api(action,p){const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action,password:PW,adminName:AD},p||{}))});const d=await r.json();if(!d.ok)throw new Error(d.error||"خطأ");return d}

function openSheet(title,nodes){const s=$("sh");s.innerHTML="";s.appendChild(h("div",{class:"grab"}));
  s.appendChild(h("div",{class:"sh-h"},h("h3",null,title),h("button",{type:"button",onclick:closeSheet,"aria-label":"إغلاق"},ic("fa-xmark"))));
  ap(s,nodes);$("ov").classList.add("show");document.body.style.overflow="hidden"}
function closeSheet(){$("ov").classList.remove("show");document.body.style.overflow=""}
$("ov").onclick=e=>{if(e.target.id==="ov")closeSheet()};

$("lf").onsubmit=async e=>{e.preventDefault();$("le").textContent="";
  const w=$("nmI").value.replace(/\s+/g," ").trim().split(" ").filter(Boolean);
  if(w.length<3||!w.every(x=>/^[\u0600-\u06FFa-zA-Z]{2,}$/.test(x))){$("le").textContent="اكتب الاسم ثلاثي بحروف فقط.";return}
  PW=$("pwI").value;AD=w.join(" ");$("lb").disabled=true;
  try{await api("ping");sessionStorage.setItem("NPH_PW",PW);sessionStorage.setItem("NPH_ADMIN",AD);$("pwI").value="";await start()}
  catch(er){PW="";AD="";$("le").textContent=er.message==="Failed to fetch"?"تعذر الاتصال بالسيرفر.":"كلمة المرور غير صحيحة."}
  $("lb").disabled=false};
$("out").onclick=()=>{sessionStorage.clear();location.reload()};
async function start(){
  busy(true,"جاري تحميل البيانات...");
  try{L=(await api("adminList")).lectures||[];
    try{SG=(await api("adminSuggestions")).suggestions||[]}catch(e){SG=[]}
    $("login").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=AD;
    updBadge();view("dash");
    api("adminLog").then(d=>{LG=d.log||[];if(V==="dash")renderDash()}).catch(()=>{});
  }catch(e){toast(net(e),true);$("login").classList.remove("hidden");$("app").classList.add("hidden")}
  busy(false)}

function view(v){V=v;["dash","lec","man","sug","log"].forEach(x=>$("v-"+x).classList.toggle("hidden",x!==v));
