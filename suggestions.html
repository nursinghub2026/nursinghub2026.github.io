<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الاقتراحات | FOUNDATIONS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="style.css">
<style>
.cols{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.sg{padding:16px;margin-bottom:12px}
.sg .t{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.sg p{font-size:14px;line-height:2;white-space:pre-wrap;overflow-wrap:anywhere}
.sg small{color:var(--mut);font-size:11px}
.rp{margin-top:10px;background:#e9f6f6;border-right:4px solid var(--teal);border-radius:12px;padding:10px 14px}
.rp b{font-size:12px;color:var(--teal);display:block;margin-bottom:3px}.rp p{font-size:13px}
#m{font-size:13px;font-weight:700;margin-top:10px;min-height:20px}
.hp{position:absolute;width:0;height:0;opacity:0;pointer-events:none}
</style></head><body>
<main class="wrap"><div class="cols">
  <form class="card" id="f">
    <div class="h2"><i class="fa-solid fa-pen-to-square"></i> ابعت اقتراحك</div>
    <div class="field"><label>النوع</label><select id="ty"><option>اقتراح</option><option>نصيحة</option><option>ملاحظة</option><option>شكر</option></select></div>
    <div class="field"><label>الاسم (اختياري)</label><input id="nm" maxlength="60"></div>
    <div class="field"><label>رسالتك</label><textarea id="ms" maxlength="450" required></textarea></div>
    <input class="hp" id="wb" tabindex="-1" autocomplete="off">
    <button class="btn" id="sb" style="width:100%"><i class="fa-solid fa-paper-plane"></i> إرسال</button><div id="m"></div>
  </form>
  <div><div class="h2"><i class="fa-solid fa-list"></i> اقتراحات الزمايل</div>
    <div class="seg"><button class="on" data-f="all">الكل</button><button data-f="rep">اللي اتردّ عليها</button></div>
    <div id="ls"><div class="empty">جاري التحميل...</div></div></div>
</div></main>
<script src="nav.js"></script>
<script>
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
let D=[],flt="all";
function draw(){const b=document.getElementById("ls");b.innerHTML="";
  const L=D.filter(s=>flt==="all"||s.reply);
  if(!L.length){b.appendChild(el("div","empty","مفيش اقتراحات هنا لسه."));return}
  L.forEach(s=>{const c=el("div","card sg"),t=el("div","t");
    t.append(el("span","pill",s.type||"اقتراح"),el("small","",(s.name||"طالب")+" - "+(isNaN(new Date(s.time))?"":new Date(s.time).toLocaleDateString("ar-EG"))));
    c.append(t,el("p","",s.message));
    if(s.reply){const r=el("div","rp");r.append(el("b","","رد الإدارة"),el("p","",s.reply));c.appendChild(r)}
    b.appendChild(c)})}
document.querySelectorAll(".seg button").forEach(x=>x.onclick=()=>{document.querySelectorAll(".seg button").forEach(y=>y.classList.remove("on"));x.classList.add("on");flt=x.dataset.f;draw()});
async function load(){try{const d=await(await fetch(API+"?suggestions=1")).json();if(!d.ok)throw 0;D=d.suggestions;draw()}catch(e){document.getElementById("ls").innerHTML='<div class="empty">مقدرناش نحمّل الاقتراحات.</div>'}}
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("sb"),m=document.getElementById("m");
  b.disabled=true;m.style.color="#6b7a8c";m.textContent="جاري الإرسال...";
  try{const d=await(await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"suggest",type:ty.value,name:nm.value,message:ms.value,website:wb.value})})).json();
    if(!d.ok)throw new Error(d.error);e.target.reset();m.style.color="#198754";m.textContent="وصلتنا رسالتك، شكرًا ليك.";load()}
  catch(err){m.style.color="#c62839";m.textContent=err.message==="Failed to fetch"?"اتأكد من النت وجرّب تاني.":err.message}
  b.disabled=false};
load();
</script></body></html>
