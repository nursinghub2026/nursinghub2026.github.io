<style>

.ty{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.ty label{cursor:pointer;min-width:0}.ty span{overflow-wrap:anywhere}.ty input{position:absolute;opacity:0;width:0;height:0}
.ty span{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:16px;border:1.5px solid var(--line);background:#f8fafc;font-size:13px;font-weight:800;color:var(--ink2);transition:.2s;text-align:center}
.ty span i{font-size:18px;color:var(--teal)}
.ty input:checked+span{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(14,143,148,.3)}
.ty input:checked+span i{color:#fff}
.cc{text-align:left;font-size:11px;color:var(--mut);direction:ltr;margin-top:-8px;margin-bottom:12px}
.sg{padding:22px;margin-bottom:16px}
.sh2{display:flex;min-width:0;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
.av{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff;background:linear-gradient(135deg,#0e8f94,#08172b)}

.sg p.m{word-break:break-word;font-size:16.5px;line-height:2.15;white-space:pre-wrap;overflow-wrap:anywhere;color:#1e2f43;font-weight:500}

.rp .rh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.rp .rh i{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;display:grid;place-items:center;font-size:14px}
.rp .rh b{font-size:14px;color:#0b6f73}

<div class="ph" style="background:linear-gradient(160deg,#08172b,#0d2f4a 55%,#0e8f94)"><div class="k"><i class="fa-solid fa-comments"></i> YOUR VOICE</div><h1>الاقتراحات والاستفسارات</h1><p>عندك سؤال أو فكرة؟ ابعتها وإحنا بنقرأ كل رسالة وبنرد عليها.</p></div>
<main class="wrap"><div class="cols">
  <form class="card fm" id="f">
    <div class="sect"><i class="fa-solid fa-pen-to-square"></i><div>ابعت رسالتك<small>الاسم اختياري</small></div></div>
    <div class="ty">
      <label><input type="radio" name="ty" value="اقتراح" checked><span><i class="fa-solid fa-lightbulb"></i>اقتراح</span></label>
      <label><input type="radio" name="ty" value="استفسار"><span><i class="fa-solid fa-circle-question"></i>استفسار</span></label>
      <label><input type="radio" name="ty" value="نصيحة"><span><i class="fa-solid fa-handshake-angle"></i>نصيحة</span></label>
      <label><input type="radio" name="ty" value="ملاحظة"><span><i class="fa-solid fa-note-sticky"></i>ملاحظة</span></label>
      <label><input type="radio" name="ty" value="شكر"><span><i class="fa-solid fa-heart"></i>شكر</span></label>
    </div>
    <div class="field"><label>اسمك (اختياري)</label><input id="nm" maxlength="60" placeholder="ممكن تسيبه فاضي"></div>
    <div class="field"><label>رسالتك</label><textarea id="ms" maxlength="440" required placeholder="اكتب سؤالك أو فكرتك بالتفصيل..." style="min-height:150px"></textarea></div>
    <div class="cc" id="cc">0 / 440</div>
    <input class="hp" id="wb" tabindex="-1" autocomplete="off">
    <button class="btn full lg" id="sb"><i class="fa-solid fa-paper-plane"></i> إرسال</button><div id="m"></div>
  </form>
  <div>
    <div class="sect"><i class="fa-solid fa-comments"></i><div>رسائل الزمايل والردود<small id="sub"></small></div></div>
    <div class="chips" id="fl"></div>
    <div id="ls"><div class="sk"></div></div>
  </div>
</div></main>
<script src="nav.js"></script><script src="luxe-student.js?v=1795860781"></script><script src="notification-inbox.js" defer></script>
<script>
const $=i=>document.getElementById(i);
let D=[],flt="all";
const FL=[["all","الكل"],["استفسار","استفسارات"],["اقتراح","اقتراحات"],["rep","تم الرد عليها"]];
function chips(){const b=$("fl");b.innerHTML="";FL.forEach(f=>b.appendChild(h("button",{class:"chip"+(flt===f[0]?" on":""),onclick:()=>{flt=f[0];chips();draw()}},f[1])))}
function draw(){const b=$("ls");b.innerHTML="";
  const L=D.map(s=>Object.assign({},s,parseSg(s))).filter(s=>flt==="all"||(flt==="rep"?!!s.reply:s.type===flt));
  $("sub").textContent=D.length+" رسالة، "+D.filter(s=>s.reply).length+" اتردّ عليها";
  if(!L.length){b.appendChild(h("div",{class:"empty card"},ic("fa-inbox"),"مفيش رسائل هنا لسه."));return}
  L.forEach(s=>{const nm=(s.name||"").trim()||"طالب";
    const c=h("div",{class:"card sg rv"},
      h("div",{class:"sh2"},h("div",{class:"av"},nm.charAt(0)),h("div",null,h("b",null,nm),h("small",null,ago(s.time))),h("span",{class:"pill "+(s.type==="استفسار"?"vio":(s.type==="شكر"?"red":"teal"))},s.type)),
      h("p",{class:"m"},s.message));
    if(s.reply)c.appendChild(h("div",{class:"rp"},h("div",{class:"rh"},ic("fa-shield-heart"),h("b",null,"رد الإدارة")),h("p",null,s.reply)));
    else c.appendChild(h("div",{class:"wt"},ic("fa-hourglass-half"),"في انتظار رد الإدارة"));
    b.appendChild(c)})}
async function load(){try{const d=await(await fetch(API+"?suggestions=1")).json();if(!d.ok)throw 0;D=d.suggestions||[];draw()}catch(e){$("ls").innerHTML="";$("ls").appendChild(h("div",{class:"empty card"},ic("fa-triangle-exclamation"),"مقدرناش نحمّل الرسائل. اتأكد من النت وجرّب تاني."))}}
$("ms").oninput=()=>{$("cc").textContent=$("ms").value.length+" / 440"};
$("f").onsubmit=async e=>{e.preventDefault();const b=$("sb"),m=$("m");
  const type=(document.querySelector('input[name="ty"]:checked')||{}).value||"اقتراح";
  const msg=$("ms").value.trim();if(msg.length<3){m.style.color="var(--danger-text)";m.textContent="اكتب رسالتك الأول.";return}
  b.disabled=true;m.style.color="var(--mut)";m.textContent="جاري الإرسال...";
  const body={action:"suggest",type:type==="استفسار"?"اقتراح":type,name:$("nm").value,message:type==="استفسار"?"[استفسار] "+msg:msg,website:$("wb").value};
  try{const d=await(await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})).json();
    if(!d.ok)throw new Error(d.error);e.target.reset();$("cc").textContent="0 / 440";m.style.color="var(--success-text)";m.textContent="وصلتنا رسالتك، شكرًا ليك. هنرد عليك هنا في أقرب وقت.";load()}
  catch(err){m.style.color="var(--danger-text)";m.textContent=err.message==="Failed to fetch"?"اتأكد من النت وجرّب تاني.":err.message}
  b.disabled=false};
chips();load();
</script></body></html>
