<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نصايح المذاكرة | FOUNDATIONS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="style.css">
<style>
.vs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:none}
.v{flex:0 0 min(86%,380px);scroll-snap-align:center;background:linear-gradient(160deg,#10243a,#16506a 70%,#0f8b8d);color:#fff;border-radius:20px;padding:22px 16px;text-align:center}
.v b{font-family:Amiri,serif;font-size:clamp(20px,5.4vw,25px);line-height:2.1;font-weight:700}
.v small{display:block;color:#a9e6e8;font-size:12px;margin-top:6px}
.cat{font-size:17px;font-weight:900;margin:26px 0 12px;display:flex;gap:10px;align-items:center;color:var(--ink2)}
.cat i{width:36px;height:36px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.tp{padding:18px;border-right:5px solid var(--teal)}.tp.hl{border-right-color:#c62839;background:#fff9f9}
.tp i{color:var(--teal);font-size:20px;margin-bottom:8px;display:block}.tp.hl i{color:#c62839}
.tp h3{font-size:16px;font-weight:900;margin-bottom:5px}.tp p{font-size:14px;color:#475569;line-height:2}
</style></head><body>
<main class="wrap"><div class="h2"><i class="fa-solid fa-graduation-cap"></i> نصايح المذاكرة</div>
<div class="vs" id="vs"></div><div id="cats"></div></main>
<script src="nav.js"></script><script src="data.js"></script>
<script>
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
VERSES.forEach(v=>{const d=el("div","v");d.append(el("b","",v.q),el("small","",v.r));document.getElementById("vs").appendChild(d)});
TIP_CATS.forEach(c=>{const h=el("div","cat");h.append(el("i","fa-solid "+c.ic),document.createTextNode(c.t));
  const g=el("div","tg");c.tips.forEach(t=>{const d=el("div","card tp"+(t.hl?" hl":""));d.append(el("i","fa-solid "+t.ic),el("h3","",t.h),el("p","",t.p));g.appendChild(d)});
  document.getElementById("cats").append(h,g)});
</script></body></html>
