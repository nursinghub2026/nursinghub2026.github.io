<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecture | Nursing Practical Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#f3f6fa;color:#1b263b}
.bar{background:#1b263b;color:#fff;padding:16px 6%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:4px solid #087f8c}
.brand{direction:ltr;font-size:17px;font-weight:900}
.back{color:#fff;text-decoration:none;border:1px solid #ffffff55;padding:9px 16px;border-radius:10px;font-size:13px}
.container{max-width:960px;margin:24px auto;padding:0 16px 50px}
.lhead{background:linear-gradient(160deg,#1b263b,#16405a 65%,#087f8c);color:#fff;border-radius:20px;padding:28px 24px;margin-bottom:20px}
.lhead h1{font-size:28px;font-weight:900;line-height:1.6}
.lhead .en{font-size:17px;color:#5fe0e6;margin-top:2px;direction:ltr;text-align:right;font-weight:700}
.lhead .meta{font-size:14px;color:#cbd5e1;margin-top:12px}
.lhead p{font-size:16px;color:#e2e8f0;margin-top:12px;line-height:2}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:20px}
.tab{background:#fff;border:1px solid #e4eaf0;border-radius:14px;padding:16px 6px;text-align:center;color:#7b8798;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;transition:.2s}
.tab i{display:block;font-size:24px;margin-bottom:8px}
.tab small{display:block;font-size:12px;font-weight:600;margin-top:2px}
.tab.active{background:#087f8c;color:#fff;border-color:#087f8c;box-shadow:0 6px 16px #087f8c44}
.items{display:grid;gap:16px}
.item{background:#fff;border-radius:18px;padding:24px;box-shadow:0 6px 20px #1b263b0f;border-right:5px solid #087f8c}
.item h3{font-size:21px;font-weight:900;line-height:1.7}
.item p{color:#334155;font-size:17px;line-height:2.2;margin-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:#087f8c;background:#e6f5f5;padding:7px 14px;border-radius:22px;overflow-wrap:anywhere}
.pv img{max-width:100%;border-radius:12px;margin-top:14px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{border-radius:11px;padding:13px 24px;font-size:15px;font-weight:800;text-decoration:none;display:inline-block}
.open{background:#087f8c;color:#fff}
.dl{background:#edf1f6;color:#1b263b}
.empty{text-align:center;padding:40px;color:#64748b;background:#fff;border-radius:16px;font-size:16px}
footer{background:#1b263b;color:#aeb9ca;text-align:center;padding:24px 12px;font-size:12px;direction:ltr;line-height:2}
.dev{font-size:10px;opacity:.65;margin-top:6px}
@media(max-width:560px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.lhead h1{font-size:23px}.item h3{font-size:19px}.item p{font-size:16px}}
</style>
</head>
<body>

<div class="bar">
  <div class="brand">Nursing Practical Hub</div>
  <a href="Lectures.html" class="back"><i class="fa-solid fa-arrow-right"></i> كل المحاضرات</a>
</div>

<main class="container" id="app"><div class="empty"><i class="fa-solid fa-spinner fa-spin"></i> ثواني وجاي...</div></main>

<footer>
  Nursing Practical Hub<br>Faculty of Nursing – Port Said University
  <div class="dev">تم تطويره بواسطة Abdelrhman Wael</div>
</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzAkny0ZeMMNTDTxx9Tjw5dvXQO-oe_K1TyYrRjSnkt5acZXD1bgYZFU4E7ODl42QDZpQ/exec";
const CK = "NPH_PUB_V1";
const SECTIONS = {
  explanation:{en:"Explanation",ar:"الشرح",icon:"fa-book-open"},
  skills:{en:"Practical Skills",ar:"المهارات العملية",icon:"fa-stethoscope"},
  checklists:{en:"Checklist",ar:"قائمة التحقق",icon:"fa-clipboard-check"},
  quizzes:{en:"Quiz",ar:"الاختبار",icon:"fa-brain"}
};
const app = document.getElementById("app");
const lid = new URLSearchParams(location.search).get("id");
let lecture = null, tab = "explanation";

function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
const ext = n => (n.split(".").pop() || "").toLowerCase();
const size = b => b >= 1048576 ? (b/1048576).toFixed(2)+" MB" : (b/1024).toFixed(1)+" KB";
function icon(n){const e=ext(n);
  if(e==="pdf")return"fa-file-pdf";if(["doc","docx"].includes(e))return"fa-file-word";
  if(["ppt","pptx"].includes(e))return"fa-file-powerpoint";if(["jpg","jpeg","png","webp"].includes(e))return"fa-file-image";
  if(e==="mp4")return"fa-file-video";if(e==="mp3")return"fa-file-audio";return"fa-file-lines"}
function msg(t){app.innerHTML="";app.appendChild(el("div","empty",t))}

function render(){
  app.innerHTML = "";
  const h = el("div","lhead");
  h.append(el("h1","",lecture.titleAr || lecture.title), el("div","en",lecture.title), el("div","meta",lecture.subject+" | "+lecture.level));
  if (lecture.description) h.appendChild(el("p","",lecture.description));
  app.appendChild(h);

  const tabs = el("div","tabs");
  Object.keys(SECTIONS).forEach(k => {
    const s = SECTIONS[k], b = el("button","tab"+(k===tab?" active":""));
    b.append(el("i","fa-solid "+s.icon), document.createTextNode(s.en), el("small","",s.ar));
    b.addEventListener("click",() => { tab = k; render(); });
    tabs.appendChild(b);
  });
  app.appendChild(tabs);

  const wrap = el("div","items");
  const items = (lecture.sections && lecture.sections[tab]) || [];
  if (!items.length) wrap.appendChild(el("div","empty","لسه مفيش محتوى في القسم ده."));
  items.forEach(it => {
    const c = el("div","item");
    c.appendChild(el("h3","",it.title));
    if (it.description) c.appendChild(el("p","",it.description));
    if (it.file) {
      const chip = el("span","chip");
      chip.append(el("i","fa-solid "+icon(it.file.name)), document.createTextNode(it.file.name+" ("+size(it.file.size)+")"));
      c.appendChild(chip);
      if (["jpg","jpeg","png","webp"].includes(ext(it.file.name))) {
        const pv = el("div","pv"), img = document.createElement("img");
        img.src = "https://drive.google.com/thumbnail?id="+it.file.id+"&sz=w1200"; img.alt = it.title; img.loading = "lazy";
        pv.appendChild(img); c.appendChild(pv);
      }
      const a = el("div","acts");
      const o = el("a","btn open","افتح الملف"); o.href = "https://drive.google.com/file/d/"+it.file.id+"/view"; o.target = "_blank"; o.rel = "noopener";
      const d = el("a","btn dl","نزّل الملف"); d.href = "https://drive.google.com/uc?export=download&id="+it.file.id; d.target = "_blank"; d.rel = "noopener";
      a.append(o,d); c.appendChild(a);
    }
    wrap.appendChild(c);
  });
  app.appendChild(wrap);
}

function show(list){
  const l = list.find(x => String(x.id) === String(lid));
  if (!l) return false;
  lecture = l; document.title = l.title+" | Nursing Practical Hub"; render(); return true;
}

async function load(){
  if (!lid) return msg("المحاضرة مش متحددة. ارجع لقائمة المحاضرات.");
  let shown = false;
  try { const c = JSON.parse(localStorage.getItem(CK) || "null"); if (c) shown = show(c); } catch(e){}
  try {
    const data = await (await fetch(API_URL)).json();
    if (!data.ok) throw new Error(data.error);
    try { localStorage.setItem(CK,JSON.stringify(data.lectures || [])); } catch(e){}
    if (!show(data.lectures || [])) msg("المحاضرة دي مش موجودة أو لسه ما اتنشرتش.");
  } catch(e){
    if (!shown) msg("مقدرناش نحمّل المحاضرة. اتأكد من النت وجرّب تاني.");
  }
}
load();
</script>
</body>
</html>
