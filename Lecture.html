<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture | FOUNDATIONS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="style.css">
<style>
.lh{position:relative;color:#fff;border-radius:30px;padding:30px 24px;margin-bottom:18px;background:linear-gradient(150deg,#08172b,#0d2f4a 55%,#0e8f94);overflow:hidden;box-shadow:var(--sh2)}
body.theory .lh{background:linear-gradient(150deg,#120d2e,#2c2266 55%,#6b4fb3)}
.lh::before{content:"";position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%);top:-110px;left:-70px}
.lh>*{position:relative}
.lh h1{font-size:clamp(26px,6.4vw,40px);font-weight:900;line-height:1.5;margin-top:12px}
.lh .en{font-size:clamp(14px,3.8vw,18px);color:#bfeff0;direction:ltr;text-align:right;font-weight:700}
body.theory .lh .en{color:#d9c8f5}
.lh .mp{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.lh .mp .pill{background:rgba(255,255,255,.14);color:#fff}
.lh p{font-size:15px;color:#e2e8f0;margin-top:14px;line-height:2.1}
.tw{position:sticky;top:62px;z-index:20;margin:0 -16px 18px;padding:8px 16px;background:rgba(243,247,250,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tabs.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tab{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center;color:var(--mut);font-size:13px;font-weight:800;cursor:pointer;transition:.2s}
.tab i{display:block;font-size:20px;margin-bottom:4px}.tab small{display:block;font-size:10.5px;font-weight:600}
.tab em{position:absolute;top:6px;left:8px;font-style:normal;font-size:10px;font-weight:900;background:var(--acs);color:var(--ac);min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center}
.tab.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent;box-shadow:0 10px 22px rgba(13,34,56,.2)}
.tab.on em{background:rgba(255,255,255,.25);color:#fff}
.items{display:grid;gap:16px}
.item{display:flex;gap:16px;background:#fff;border-radius:24px;padding:22px;box-shadow:var(--sh);border:1px solid rgba(13,34,56,.05)}
.item .num{flex:none;width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-weight:900;font-size:16px}
.ib{flex:1;min-width:0}
.item h3{font-size:clamp(17px,4.4vw,21px);font-weight:900;line-height:1.7}
.item p{color:#334155;font-size:15.5px;line-height:2.15;margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.fc{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px;border-radius:18px;background:var(--acs)}
.fc .fi{width:46px;height:46px;flex:none;border-radius:14px;background:#fff;color:var(--ac);display:grid;place-items:center;font-size:21px}
.fc b{display:block;font-size:13px;overflow-wrap:anywhere;direction:ltr;text-align:right}.fc small{color:var(--mut);font-size:11.5px}
.pv img{max-width:100%;border-radius:16px;margin-top:12px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}
.pn a{background:#fff;border-radius:20px;padding:16px;box-shadow:var(--sh);display:block;border:1px solid rgba(13,34,56,.05);transition:.2s}
.pn a:hover{transform:translateY(-3px)}
.pn small{display:block;color:var(--mut);font-size:11.5px;font-weight:700}.pn b{font-size:14px;line-height:1.6;display:block}
.pn a.nx{text-align:left}
@media(max-width:560px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.item{padding:16px;gap:12px}.item .num{width:38px;height:38px;font-size:14px;border-radius:12px}}
</style></head><body>
<main class="wrap" id="app"><div class="sk" style="min-height:200px"></div></main>
<script src="nav.js"></script>
<script>
const CK="NPH_PUB_V1";
const SEC={explanation:{en:"Explanation",ar:"الشرح",icon:"fa-book-open"},skills:{en:"Skills",ar:"المهارات العملية",icon:"fa-hand-holding-medical"},checklists:{en:"Checklist",ar:"الشيك ليست",icon:"fa-clipboard-check"},quizzes:{en:"Quiz",ar:"الكويزات",icon:"fa-brain"}};
const TSEC={explanation:{en:"Summaries",ar:"شرح وملخصات",icon:"fa-book-open"},quizzes:{en:"Quiz",ar:"كويز",icon:"fa-brain"}};
const app=document.getElementById("app"),lid=new URLSearchParams(location.search).get("id");
let lecture=null,LST=[],tab="explanation";
const ext=n=>(n.split(".").pop()||"").toLowerCase();
const isHtml=n=>["html","htm"].includes(ext(n));
const size=b=>b>=1048576?(b/1048576).toFixed(2)+" MB":(b/1024).toFixed(1)+" KB";
function fic(n){const e=ext(n);if(e==="pdf")return"fa-file-pdf";if(["doc","docx"].includes(e))return"fa-file-word";if(["ppt","pptx"].includes(e))return"fa-file-powerpoint";if(["jpg","jpeg","png","webp"].includes(e))return"fa-file-image";if(e==="mp4")return"fa-file-video";if(e==="mp3")return"fa-file-audio";if(isHtml(n))return"fa-file-code";return"fa-file-lines"}
function msg(t){app.innerHTML="";app.appendChild(h("div",{class:"empty"},ic("fa-circle-info"),t))}
function chromeLink(u){const ua=navigator.userAgent;const inC=/Chrome\//.test(ua)&&!/EdgA|Edg\/|OPR|SamsungBrowser|CriOS/.test(ua);
  if(/CriOS/.test(ua)||inC)return null;
  if(/Android/i.test(ua))return"intent://"+u.replace(/^https?:\/\//,"")+"#Intent;scheme="+(u.indexOf("https")===0?"https":"http")+";package=com.android.chrome;end";
  if(/iPhone|iPad|iPod/i.test(ua))return u.replace(/^https:/,"googlechromes:").replace(/^http:/,"googlechrome:");return null}
function itemCard(it,i){
  const b=h("div",{class:"ib"},h("h3",null,it.title));
  if(it.description)b.appendChild(h("p",null,it.description));
  if(it.file){
    b.appendChild(h("div",{class:"fc"},h("div",{class:"fi"},ic(fic(it.file.name))),h("div",null,h("b",null,it.file.name),h("small",null,size(it.file.size)))));
    if(["jpg","jpeg","png","webp"].includes(ext(it.file.name)))b.appendChild(h("div",{class:"pv"},h("img",{src:"https://drive.google.com/thumbnail?id="+it.file.id+"&sz=w1200",alt:it.title,loading:"lazy"})));
    const a=h("div",{class:"acts"});
    if(isHtml(it.file.name)){
      const v=new URL("view.html?f="+encodeURIComponent(it.file.id),location.href).href;
      a.appendChild(h("a",{class:"btn",href:v,target:"_blank",rel:"noopener"},ic("fa-up-right-from-square")," افتح الصفحة"));
      const cl=chromeLink(v);if(cl)a.appendChild(h("a",{class:"btn dark",href:cl},ic("fa-brands fa-chrome")," افتح في Chrome"));
    }else a.appendChild(h("a",{class:"btn",href:"https://drive.google.com/file/d/"+it.file.id+"/view",target:"_blank",rel:"noopener"},ic("fa-eye")," افتح الملف"));
    a.appendChild(h("a",{class:"btn ghost",href:"https://drive.google.com/uc?export=download&id="+it.file.id,target:"_blank",rel:"noopener"},ic("fa-download")," نزّل الملف"));
    b.appendChild(a)}
  return h("div",{class:"item rv"},h("div",{class:"num"},String(i+1).padStart(2,"0")),b)}
function render(){
  const th=lecture.track==="theory",S=th?TSEC:SEC;
  if(!S[tab])tab="explanation";
  document.body.classList.toggle("theory",th);
  app.innerHTML="";
  const cn=k=>((lecture.sections&&lecture.sections[k])||[]).length;
  app.appendChild(h("a",{class:"btn ghost sm",href:"Lectures.html?track="+(th?"theory":"practical"),style:"margin-bottom:14px"},ic("fa-arrow-right")," "+(th?"المحاضرات النظرية":"المحاضرات العملية")));
  const hd=h("div",{class:"lh"},h("span",{class:"pill",style:"background:rgba(255,255,255,.18);color:#fff"},th?"نظري":"عملي"),
    h("h1",null,lecture.titleAr||lecture.title),h("div",{class:"en"},lecture.title),
    h("div",{class:"mp"},h("span",{class:"pill"},lecture.subject),h("span",{class:"pill"},lecture.level)));
  if(lecture.description)hd.appendChild(h("p",null,lecture.description));
  app.appendChild(hd);
  const tabs=h("div",{class:"tabs"+(th?" two":"")});
  Object.keys(S).forEach(k=>{const s=S[k];
    tabs.appendChild(h("button",{class:"tab"+(k===tab?" on":""),onclick:()=>{tab=k;render();window.scrollTo({top:hd.offsetTop+hd.offsetHeight-40,behavior:"smooth"})}},h("em",null,String(cn(k))),ic(s.icon),s.en,h("small",null,s.ar)))});
  app.appendChild(h("div",{class:"tw"},tabs));
  const wrap=h("div",{class:"items"}),items=(lecture.sections&&lecture.sections[tab])||[];
  if(!items.length)wrap.appendChild(h("div",{class:"empty card"},ic("fa-folder-open"),"لسه مفيش محتوى في القسم ده."));
  items.forEach((it,i)=>wrap.appendChild(itemCard(it,i)));
  app.appendChild(wrap);
  const same=LST.filter(l=>(l.track==="theory")===th),i=same.findIndex(x=>String(x.id)===String(lecture.id));
  const pv=same[i-1],nx=same[i+1];
  if(pv||nx){const pn=h("div",{class:"pn"});
    pn.appendChild(pv?h("a",{href:"Lecture.html?id="+encodeURIComponent(pv.id)},h("small",null,"المحاضرة السابقة"),h("b",null,pv.titleAr||pv.title)):h("span"));
    pn.appendChild(nx?h("a",{class:"nx",href:"Lecture.html?id="+encodeURIComponent(nx.id)},h("small",null,"المحاضرة التالية"),h("b",null,nx.titleAr||nx.title)):h("span"));
    app.appendChild(pn)}}
function show(list){LST=list;const l=list.find(x=>String(x.id)===String(lid));if(!l)return false;lecture=l;document.title=l.title+" | FOUNDATIONS";render();return true}
async function load(){
  if(!lid)return msg("المحاضرة مش متحددة. ارجع لقائمة المحاضرات.");
  let shown=false;
  try{const c=JSON.parse(localStorage.getItem(CK)||"null");if(c)shown=show(c)}catch(e){}
  try{const d=await(await fetch(API)).json();if(!d.ok)throw new Error(d.error);
    try{localStorage.setItem(CK,JSON.stringify(d.lectures||[]))}catch(e){}
    if(!show(d.lectures||[]))msg("المحاضرة دي مش موجودة أو لسه ما اتنشرتش.")}
  catch(e){if(!shown)msg("مقدرناش نحمّل المحاضرة. اتأكد من النت وجرّب تاني.")}}
load();
</script></body></html>
