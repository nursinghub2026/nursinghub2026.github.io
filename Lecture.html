<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture | FOUNDATIONS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="style.css">
<style>
.lh{background:linear-gradient(160deg,#0b1b2d,#10243a 55%,#0f6f78);color:#fff;border-radius:22px;padding:26px 22px;margin-bottom:18px}
body.theory .lh{background:linear-gradient(160deg,#1b1740,#3b2f6b 55%,#6a4ba0)}
.lh h1{font-size:26px;font-weight:900;line-height:1.6}
.lh .en{font-size:16px;color:#bfeff0;margin-top:2px;direction:ltr;text-align:right;font-weight:700}
.lh .meta{font-size:13px;color:#cbd5e1;margin-top:10px}
.lh p{font-size:15px;color:#e2e8f0;margin-top:10px;line-height:2}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}
.tabs.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tab{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px 6px;text-align:center;color:var(--mut);font-size:13px;font-weight:800;cursor:pointer;transition:.2s}
.tab i{display:block;font-size:22px;margin-bottom:7px}.tab small{display:block;font-size:11px;font-weight:600;margin-top:2px}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 6px 16px #10243a2e}
.items{display:grid;gap:14px}
.item{background:#fff;border-radius:18px;padding:22px;box-shadow:0 6px 20px #10243a0f;border-right:5px solid var(--ac)}
.item h3{font-size:20px;font-weight:900;line-height:1.7}
.item p{color:#334155;font-size:16px;line-height:2.2;margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--ac);background:var(--acs);padding:7px 14px;border-radius:22px;overflow-wrap:anywhere}
.pv img{max-width:100%;border-radius:12px;margin-top:12px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.acts a{border-radius:11px;padding:12px 22px;font-size:14px;font-weight:800;display:inline-block}
.o{background:var(--ac);color:#fff}.d{background:#edf1f6;color:var(--ink)}.c{background:#4285f4;color:#fff}
.bk{display:inline-flex;margin-bottom:14px}
@media(max-width:560px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.lh h1{font-size:22px}}
</style></head><body>
<main class="wrap" id="app"><div class="empty">جاري التحميل...</div></main>
<script src="nav.js"></script>
<script>
const CK="NPH_PUB_V1";
const SEC={explanation:{en:"Explanation",ar:"الشرح",icon:"fa-book-open"},skills:{en:"Practical Skills",ar:"المهارات العملية",icon:"fa-stethoscope"},checklists:{en:"Checklist",ar:"قائمة التحقق",icon:"fa-clipboard-check"},quizzes:{en:"Quiz",ar:"الاختبار",icon:"fa-brain"}};
const TSEC={explanation:{en:"Explanation & Summaries",ar:"شرح وملخصات",icon:"fa-book-open"},quizzes:{en:"Quiz",ar:"كويز",icon:"fa-brain"}};
const app=document.getElementById("app"),lid=new URLSearchParams(location.search).get("id");
let lecture=null,tab="explanation";
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const ext=n=>(n.split(".").pop()||"").toLowerCase();
const isHtml=n=>["html","htm"].includes(ext(n));
const size=b=>b>=1048576?(b/1048576).toFixed(2)+" MB":(b/1024).toFixed(1)+" KB";
function icon(n){const e=ext(n);if(e==="pdf")return"fa-file-pdf";if(["doc","docx"].includes(e))return"fa-file-word";if(["ppt","pptx"].includes(e))return"fa-file-powerpoint";if(["jpg","jpeg","png","webp"].includes(e))return"fa-file-image";if(e==="mp4")return"fa-file-video";if(e==="mp3")return"fa-file-audio";if(["html","htm"].includes(e))return"fa-file-code";return"fa-file-lines"}
function msg(t){app.innerHTML="";app.appendChild(el("div","empty",t))}
function chromeLink(u){const ua=navigator.userAgent;const inC=/Chrome\//.test(ua)&&!/EdgA|Edg\/|OPR|SamsungBrowser|CriOS/.test(ua);
  if(/CriOS/.test(ua)||inC)return null;
  if(/Android/i.test(ua))return"intent://"+u.replace(/^https?:\/\//,"")+"#Intent;scheme="+(u.indexOf("https")===0?"https":"http")+";package=com.android.chrome;end";
  if(/iPhone|iPad|iPod/i.test(ua))return u.replace(/^https:/,"googlechromes:").replace(/^http:/,"googlechrome:");return null}
function render(){
  const th=lecture.track==="theory",S=th?TSEC:SEC;
  if(!S[tab])tab="explanation";
  document.body.classList.toggle("theory",th);
  app.innerHTML="";
  const bk=el("a","btn ghost sm bk",th?"المحاضرات النظرية":"المحاضرات العملية");bk.href="Lectures.html?track="+(th?"theory":"practical");app.appendChild(bk);
  const h=el("div","lh");
  h.append(el("h1","",lecture.titleAr||lecture.title),el("div","en",lecture.title),el("div","meta",lecture.subject+" | "+lecture.level));
  if(lecture.description)h.appendChild(el("p","",lecture.description));
  app.appendChild(h);
  const tabs=el("div","tabs"+(th?" two":""));
  Object.keys(S).forEach(k=>{const s=S[k],b=el("button","tab"+(k===tab?" on":""));
    b.append(el("i","fa-solid "+s.icon),document.createTextNode(s.en),el("small","",s.ar));
    b.onclick=()=>{tab=k;render()};tabs.appendChild(b)});
  app.appendChild(tabs);
  const wrap=el("div","items"),items=(lecture.sections&&lecture.sections[tab])||[];
  if(!items.length)wrap.appendChild(el("div","empty","لسه مفيش محتوى في القسم ده."));
  items.forEach(it=>{
    const c=el("div","item");c.appendChild(el("h3","",it.title));
    if(it.description)c.appendChild(el("p","",it.description));
    if(it.file){
      const chip=el("span","chip");chip.append(el("i","fa-solid "+icon(it.file.name)),document.createTextNode(it.file.name+" ("+size(it.file.size)+")"));c.appendChild(chip);
      if(["jpg","jpeg","png","webp"].includes(ext(it.file.name))){const pv=el("div","pv"),img=document.createElement("img");img.src="https://drive.google.com/thumbnail?id="+it.file.id+"&sz=w1200";img.alt=it.title;img.loading="lazy";pv.appendChild(img);c.appendChild(pv)}
      const a=el("div","acts");
      if(isHtml(it.file.name)){
        const v=new URL("view.html?f="+encodeURIComponent(it.file.id),location.href).href;
        const o=el("a","o","افتح الصفحة");o.href=v;o.target="_blank";o.rel="noopener";a.appendChild(o);
        const cl=chromeLink(v);if(cl){const b=el("a","c","افتح في Chrome");b.href=cl;a.appendChild(b)}
      }else{const o=el("a","o","افتح الملف");o.href="https://drive.google.com/file/d/"+it.file.id+"/view";o.target="_blank";o.rel="noopener";a.appendChild(o)}
      const d=el("a","d","نزّل الملف");d.href="https://drive.google.com/uc?export=download&id="+it.file.id;d.target="_blank";d.rel="noopener";a.appendChild(d);c.appendChild(a)}
    wrap.appendChild(c)});
  app.appendChild(wrap)}
function show(list){const l=list.find(x=>String(x.id)===String(lid));if(!l)return false;lecture=l;document.title=l.title+" | FOUNDATIONS";render();return true}
async function load(){
  if(!lid)return msg("المحاضرة مش متحددة. ارجع لقائمة المحاضرات.");
  let shown=false;
  try{const c=JSON.parse(localStorage.getItem(CK)||"null");if(c)shown=show(c)}catch(e){}
  try{const d=await(await fetch(API)).json();if(!d.ok)throw new Error(d.error);
    try{localStorage.setItem(CK,JSON.stringify(d.lectures||[]))}catch(e){}
    if(!show(d.lectures||[]))msg("المحاضرة دي مش موجودة أو لسه ما اتنشرتش.")}
  catch(e){if(!shown)msg("مقدرناش نحمّل المحاضرة. اتأكد من النت وجرّب تاني.")}}
load();
</script></body></html>
