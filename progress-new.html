<style>
.phero{position:relative;color:#fff;border-radius:30px;padding:30px 24px;margin-bottom:18px;background:linear-gradient(150deg,#08172b,#0d2f4a 55%,#0e8f94);overflow:hidden;box-shadow:var(--sh2)}

.pbig .pt{flex:1}

.pbig .pt small{color:#cfe0ea;font-size:13px;line-height:1.9;display:block}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-top:18px}
.pstats div{text-align:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:10px 6px}

.tr2 .tb2{flex:1}
.tr2 .tb2 .row{display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:6px}
.tr2 .tb2 .row span{color:var(--mut);font-weight:700;font-size:12px}
.streakn{display:flex;align-items:baseline;gap:8px}
.streakn b{font-size:46px;font-weight:900;color:var(--ink);line-height:1;direction:ltr}
.streakn span{color:var(--mut);font-size:13px;font-weight:700}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wk div{text-align:center;border-radius:12px;padding:8px 2px;background:#f1f5f9;color:var(--mut);font-size:11px;font-weight:800}
.wk div i{display:block;font-size:13px;margin-bottom:3px}
.wk div.on{background:var(--acs);color:var(--ac)}
.wk div.td{outline:1.5px dashed var(--ac);outline-offset:-4px}
.wk small{display:block;font-size:9.5px;font-weight:700}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.bdg2{text-align:center;border-radius:18px;padding:14px 8px;background:#f6f8fb;border:1.5px dashed var(--line);color:var(--mut)}
.bdg2 .bi2{width:46px;height:46px;margin:0 auto 8px;border-radius:15px;display:grid;place-items:center;font-size:19px;background:#e8edf3;color:#a5b3c2}

.plec .plb .row{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:800;margin-bottom:5px}
.plec .plb .row span{flex:none;color:var(--ac);font-size:12px;direction:ltr}
.plec .plb .row a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdang{margin-top:26px;text-align:center}
.pdang button{background:none;border:0;color:#c0283a;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;text-decoration:underline}

.pempty .pei{width:76px;height:76px;margin:0 auto 14px;border-radius:24px;display:grid;place-items:center;font-size:32px;color:#fff;background:linear-gradient(135deg,var(--teal),var(--teal2))}
.pempty b{font-size:18px;display:block;margin-bottom:6px}
.pempty p{color:var(--mut);font-size:14px;line-height:2;margin-bottom:18px}
.pempty .ctas{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

<div class="ph"><div class="k"><i class="fa-solid fa-chart-line"></i> MY PROGRESS</div><h1>تقدمي</h1><p>كل مذاكرتك في مكان واحد: نسبة إنجازك، أيامك، أوسمتك، ومفضلتك. سجل دخولك عشان تقدّمك يتزامن مع حسابك وتكمّل من أي جهاز.</p></div>

<script>
const CK="NPH_PUB_V1";
const $=i=>document.getElementById(i);
const app=$("app");
let L=[];
const SEC_N={explanation:"الشرح",skills:"المهارات",checklists:"الشيك ليست",quizzes:"الكويزات"};
function contCard(){
  const last=NPH.getLast();if(!last)return null;
  const l=L.find(x=>String(x.id)===last.lid);if(!l)return null;
  const p=NPH.lectureProgress(l);
  return h("a",{class:"pcont rv",href:"Lecture.html?id="+encodeURIComponent(l.id)+"&tab="+encodeURIComponent(last.tab||"explanation")},
    h("div",{class:"pci"},ic("fa-circle-play")),
    h("div",{class:"pcb"},h("small",null,"كمّل من حيث وقفت - "+(SEC_N[last.tab]||"")),h("b",null,l.titleAr||l.title),h("div",{class:"pbar"},h("i",{style:"width:"+p.pct+"%"}))),
    h("span",{class:"pcn"},p.pct+"%"));
}
function lecRow(l){
  const p=NPH.lectureProgress(l);const th=l.track==="theory";
  return h("div",{class:"plec"},
    h("div",{class:"plb"},
      h("div",{class:"row"},h("a",{href:"Lecture.html?id="+encodeURIComponent(l.id)},l.titleAr||l.title),h("span",null,p.total?p.pct+"%":"—")),
      h("div",{class:"pbar sm"+(th?"":" ")},h("i",{style:"width:"+p.pct+"%;"+(th?"background:linear-gradient(90deg,#8a6a1c,#d4af5a)":"")}))));
}
function render(){
  app.innerHTML="";
  if(!(window.NPHAuth&&NPHAuth.isLoggedIn())){
    app.appendChild(h("div",{class:"card pcard pempty rv"},
      h("div",{class:"pei"},ic("fa-user-lock")),
      h("b",null,"سجّل دخولك الأول"),
      h("p",null,"صفحة «تقدّمي» بتتفتح لما يكون ليك حساب. سجّل دخولك أو اعمل حساب جديد وهتلاقي هنا تقدّمك وسلسلة أيامك وأوسمتك — متزامنة على كل أجهزتك."),
      h("div",{class:"ctas"},
        h("button",{class:"btn",type:"button",onclick:()=>NPHAuth.openModal("login")},ic("fa-right-to-bracket")," سجّل دخولك"),
        h("button",{class:"btn ghost",type:"button",onclick:()=>NPHAuth.openModal("register")},ic("fa-user-plus")," حساب جديد"))));
    return;
  }
  const st=NPH.statsFor(L);
  NPH.checkBadges(st);
  if(!st.done&&!NPH.favIds().length&&!NPH.notesList().length){
    app.appendChild(h("div",{class:"card pcard pempty rv"},
      h("div",{class:"pei"},ic("fa-rocket")),
      h("b",null,"لسه ما بدأتش رحلتك"),
      h("p",null,"أول ما تعلّم أي عنصر «خلصت» من جوه المحاضرات، هتلاقي تقدمك وسلسلة أيامك وأوسمتك هنا."),
      h("div",{class:"ctas"},
        h("a",{class:"btn",href:"Lectures.html?track=practical"},ic("fa-hand-holding-medical")," ابدأ العملي"),
        h("a",{class:"btn ghost",href:"Lectures.html?track=theory"},ic("fa-book-open")," النظري"))));
    return;
  }
  const cont=contCard();
  const T=L.filter(l=>l.track==="theory"),P=L.filter(l=>l.track!=="theory");
  const oT=NPH.overall(T),oP=NPH.overall(P);
  const hero=h("div",{class:"phero rv"},
    h("div",{class:"k"},"MY PROGRESS"),h("h2",null,"تقدمك في المادة"),
    h("div",{class:"pbig"},
      h("div",{class:"pnum",style:"--p:"+st.pct},h("b",null,st.pct+"%")),
      h("div",{class:"pt"},h("b",null,"خلصت "+st.done+" من "+st.total+" عنصر"),h("small",null,st.fullLecs?("وكملت "+st.fullLecs+" محاضرة بالكامل. برافو، كمّل!"):"كمّل محاضرة كاملة وخد وسامها."))),
    h("div",{class:"pstats"},
      h("div",null,h("b",null,String(st.done)),h("small",null,"عنصر مخلّص")),
      h("div",null,h("b",null,String(st.fullLecs)),h("small",null,"محاضرة كاملة")),
      h("div",null,h("b",null,String(st.streak)),h("small",null,"أيام ورا بعض"))));
  app.appendChild(hero);
  if(cont)app.appendChild(cont);
  const gr=h("div",{class:"pgrid"});
  gr.appendChild(h("div",{class:"card pcard rv"},
    h("h3",null,ic("fa-layer-group")," نسبة كل تراك"),
    h("div",{class:"tr2"},h("div",{class:"ti2",style:"background:linear-gradient(135deg,#8a6a1c,#d4af5a)"},ic("fa-book-open")),
      h("div",{class:"tb2"},h("div",{class:"row"},h("b",null,"النظري"),h("span",null,oT.done+"/"+oT.total)),h("div",{class:"pbar"},h("i",{style:"width:"+oT.pct+"%;background:linear-gradient(90deg,#8a6a1c,#d4af5a)"})))),
    h("div",{class:"tr2"},h("div",{class:"ti2",style:"background:linear-gradient(135deg,#0e8f94,#35c6c0)"},ic("fa-hand-holding-medical")),
      h("div",{class:"tb2"},h("div",{class:"row"},h("b",null,"العملي"),h("span",null,oP.done+"/"+oP.total)),h("div",{class:"pbar"},h("i",{style:"width:"+oP.pct+"%"}))))));
  const wk=NPH.last7();
  gr.appendChild(h("div",{class:"card pcard rv"},
    h("h3",null,ic("fa-fire")," سلسلة المذاكرة"),
    h("div",{class:"streakn"},h("b",null,String(st.streak)),h("span",null,"يوم ورا بعض - أطول سلسلة: "+NPH.bestStreak()+" يوم")),
    h("div",{class:"wk"},wk.map(d=>h("div",{class:(d.active?"on":"")+(d.today?" td":"")},ic(d.active?"fa-check":"fa-minus"),h("small",null,d.label))))));
  app.appendChild(gr);
  const bl=NPH.badgeList(st);
  app.appendChild(h("div",{class:"card pcard rv",style:"margin-top:16px"},
    h("h3",null,ic("fa-award")," أوسمتك"),
    h("div",{class:"bgrid"},bl.map(b=>h("div",{class:"bdg2"+(b.got?" got":"")},h("div",{class:"bi2"},ic(b.icon)),h("b",null,b.name),h("small",null,b.desc))))));
  const favs=NPH.favIds().map(id=>NPH.findItem(L,id)).filter(Boolean);
  if(favs.length){
    app.appendChild(h("div",{class:"card pcard rv",style:"margin-top:16px"},
      h("h3",null,ic("fa-star")," المفضلة"),
      favs.map(f=>h("a",{class:"pli",href:"Lecture.html?id="+encodeURIComponent(f.lecture.id)+"&tab="+encodeURIComponent(f.sec)},
        h("div",{class:"pii",style:f.lecture.track==="theory"?"background:linear-gradient(135deg,#8a6a1c,#d4af5a)":"background:linear-gradient(135deg,#0e8f94,#35c6c0)"},ic("fa-star")),
        h("div",{class:"pib"},h("b",null,f.item.title),h("small",null,(f.lecture.titleAr||f.lecture.title)+" - "+(SEC_N[f.sec]||f.sec))),
        h("span",{class:"pil"},"افتح ",ic("fa-arrow-left"))))));
  }
  const notes=NPH.notesList().map(n=>({n:n,l:L.find(x=>String(x.id)===n.lid)})).filter(x=>x.l);
  if(notes.length){
    app.appendChild(h("div",{class:"card pcard rv",style:"margin-top:16px"},
      h("h3",null,ic("fa-note-sticky")," ملاحظاتك"),
      notes.map(x=>h("a",{class:"pli",href:"Lecture.html?id="+encodeURIComponent(x.l.id)+"#notes"},
        h("div",{class:"pii",style:"background:linear-gradient(135deg,#b8862b,#e0b45a)"},ic("fa-note-sticky")),
        h("div",{class:"pib"},h("b",null,x.l.titleAr||x.l.title),h("small",null,x.n.text)),
        h("span",{class:"pil"},"افتح ",ic("fa-arrow-left"))))));
  }
  const started=L.filter(l=>{const p=NPH.lectureProgress(l);return p.done>0});
  if(started.length){
    const tg=started.filter(l=>l.track==="theory"),pg=started.filter(l=>l.track!=="theory");
    const card=h("div",{class:"card pcard rv",style:"margin-top:16px"},h("h3",null,ic("fa-list-check")," المحاضرات اللي بدأتها"));
    if(pg.length){card.appendChild(h("div",{class:"sect",style:"margin-top:4px"},ic("fa-hand-holding-medical"),h("div",null,"العملي")));pg.forEach(l=>card.appendChild(lecRow(l)))}
    if(tg.length){card.appendChild(h("div",{class:"sect",style:"margin-top:14px"},ic("fa-book-open"),h("div",null,"النظري")));tg.forEach(l=>card.appendChild(lecRow(l)))}
    app.appendChild(card);
  }
  app.appendChild(h("div",{class:"pdang"},
    h("button",{type:"button",onclick:()=>{if(confirm("متأكد؟ كل تقدمك ومفضلتك وملاحظاتك على الجهاز ده هتتمسح نهائي.")){NPH.reset();location.reload()}}},"مسح كل التقدم من الجهاز ده")));
}
async function load(){
  try{const c=JSON.parse(localStorage.getItem(CK)||"null");if(c){L=c;render()}}catch(e){}
  try{const d=await(await fetch(API)).json();if(d.ok){L=d.lectures||[];try{localStorage.setItem(CK,JSON.stringify(L))}catch(e){}}}catch(e){}
  render();
}
load();
</script><script src="firebase-config.js"></script><script src="push.js" defer></script></body></html>
