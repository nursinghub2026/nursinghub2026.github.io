<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأدعية والأذكار | FOUNDATIONS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="style.css">
<style>
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chips button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:20px;padding:9px 16px;font-weight:800;font-size:13px;color:var(--ink2);cursor:pointer}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:6px}
.it{background:#fff;border:1px solid #eef2f6;border-right:5px solid var(--c);border-radius:15px;padding:15px;text-align:right;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:800;font-size:14px;transition:.2s;color:var(--ink)}
.it:hover{box-shadow:0 8px 20px #10243a14;transform:translateY(-2px)}
.it em{font-style:normal;font-size:10px;background:#f0f4f8;color:var(--mut);padding:3px 9px;border-radius:12px;white-space:nowrap}
.ov{position:fixed;inset:0;background:#0a1626a8;display:none;align-items:flex-end;justify-content:center;z-index:100}
.ov.show{display:flex}
.sh{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:20px 18px 28px;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh h3{font-size:18px;font-weight:900;text-align:center}
.tx{font-family:Amiri,serif;font-size:clamp(22px,6vw,28px);line-height:2.3;text-align:center;white-space:pre-line;margin:14px 0}
.mi{background:#f4f7fa;border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.9;margin-top:8px}
.cn{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:18px}
.tap{width:170px;height:170px;border-radius:50%;border:0;background:radial-gradient(circle at 30% 25%,var(--c),#10243a);color:#fff;cursor:pointer;box-shadow:0 12px 28px #10243a44;-webkit-user-select:none;user-select:none;touch-action:manipulation;transition:transform .08s}
.tap:active{transform:scale(.94)}.tap b{font-size:50px;display:block;line-height:1}.tap small{font-size:13px;opacity:.9}
.tap.done{background:#198754}
.pre{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pre button{border:1px solid var(--line);background:#f8fafc;border-radius:20px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
.pre button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
</style></head><body>
<main class="wrap">
  <div class="h2"><i class="fa-solid fa-hands-praying"></i> الأدعية والأذكار</div>
  <input id="q" placeholder="دوّر على دعاء..." style="margin-bottom:12px">
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</main>
<div class="ov" id="ov"><div class="sh" id="sh"></div></div>
<script src="nav.js"></script><script src="data.js"></script>
<script>
const $=i=>document.getElementById(i);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
let gi=-1;
function chips(){const b=$("chips");b.innerHTML="";
  [["الكل",-1],...GROUPS.map((g,i)=>[g.t,i]),["السبحة",-2]].forEach(([n,i])=>{const x=el("button",i===gi?"on":"",n);x.onclick=()=>{if(i===-2){tasbeeh();return}gi=i;chips();list()};b.appendChild(x)})}
function list(){const g=$("grid");g.innerHTML="";const f=$("q").value.trim();let n=0;
  GROUPS.forEach((G,i)=>{if(gi>=0&&gi!==i)return;G.items.forEach(it=>{
    if(f&&!(it.n+it.x).includes(f))return;n++;
    const b=el("button","it");b.style.setProperty("--c",G.c);b.appendChild(el("span","",it.n));
    b.appendChild(el("em","",it.cnt||(it.k===Q?"قرآن":"سنّة")));b.onclick=()=>detail(it,G.c);g.appendChild(b)})});
  if(!n)g.appendChild(el("div","empty","مفيش نتايج."))}
function counter(target,color){let n=0;const w=el("div","cn");w.style.setProperty("--c",color);
  const t=el("button","tap");t.type="button";const b=el("b","","0"),s=el("small");t.append(b,s);
  const m=el("div","pill gold"),r=el("button","btn ghost sm","إعادة من الصفر");
  function d(){b.textContent=n;s.textContent=target?"من "+target:"اضغط للعد";t.classList.toggle("done",!!target&&n>=target);m.textContent=target&&n>=target?"اكتمل العدد":(target?"الهدف "+target:"عدّاد حر")}
  t.onclick=()=>{n++;d();try{navigator.vibrate&&navigator.vibrate(target&&n===target?[70,40,70]:12)}catch(e){}};
  r.onclick=()=>{n=0;d()};d();w.append(t,m,r);return w}
function open_(){$("ov").classList.add("show");document.body.style.overflow="hidden"}
function close_(){$("ov").classList.remove("show");document.body.style.overflow=""}
$("ov").onclick=e=>{if(e.target.id==="ov")close_()};
function detail(it,c){const s=$("sh");s.innerHTML="";
  s.appendChild(el("h3","",it.n));s.appendChild(el("div","tx",it.x));
  [["المصدر",it.s],["وقته",it.w],...(it.cnt?[["عدد المرات",it.cnt]]:[])].forEach(([l,v])=>{const d=el("div","mi");d.appendChild(el("b","",l+": "));d.appendChild(document.createTextNode(v));s.appendChild(d)});
  const m=it.cnt?(it.cnt.includes("واحدة")?1:parseInt((it.cnt.match(/\d+/)||[0])[0])):0;
  if(m)s.appendChild(counter(m,c));
  const row=el("div");row.style.cssText="display:flex;gap:8px;margin-top:18px";
  const cp=el("button","btn dark","نسخ");cp.style.flex=1;cp.onclick=async()=>{try{await navigator.clipboard.writeText(it.n+"\n\n"+it.x+"\n\n"+it.s);cp.textContent="تم النسخ"}catch(e){}};
  const cl=el("button","btn ghost","إغلاق");cl.style.flex=1;cl.onclick=close_;row.append(cp,cl);s.appendChild(row);open_()}
function tasbeeh(){const s=$("sh");s.innerHTML="";s.appendChild(el("h3","","السبحة الإلكترونية"));
  const pre=el("div","pre");pre.style.margin="14px 0";const z=el("div");const bs=[];
  function pick(i){const p=PRESETS[i];bs.forEach((b,j)=>b.classList.toggle("on",j===i));z.innerHTML="";
    if(p.t)z.appendChild(el("div","tx",p.n));z.appendChild(counter(p.t,"#b8862b"))}
  PRESETS.forEach((p,i)=>{const b=el("button","",p.n);b.onclick=()=>pick(i);bs.push(b);pre.appendChild(b)});
  s.append(pre,z);const cl=el("button","btn ghost","إغلاق");cl.style.cssText="width:100%;margin-top:18px";cl.onclick=close_;s.appendChild(cl);pick(0);open_()}
$("q").oninput=list;chips();list();
</script></body></html>
