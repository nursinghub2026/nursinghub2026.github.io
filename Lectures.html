<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lectures | Nursing Practical Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#f3f6fa;color:#1b263b}
.hero{background:linear-gradient(160deg,#1b263b,#16405a 65%,#087f8c);color:#fff;padding:24px 6% 50px;border-radius:0 0 34px 34px;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.brand{direction:ltr;text-align:left;font-size:18px;font-weight:900}
.brand small{display:block;color:#5fe0e6;font-size:10px;margin-top:3px;font-weight:600}
.home{color:#fff;text-decoration:none;border:1px solid #ffffff55;padding:9px 16px;border-radius:10px;font-size:13px}
.hero h1{font-size:32px;font-weight:900}
.hero p{color:#d5dce8;font-size:15px;margin-top:8px}
.search{max-width:600px;margin:-26px auto 26px;padding:0 16px}
.sbox{display:flex;align-items:center;background:#fff;border-radius:14px;padding:4px 18px;box-shadow:0 8px 24px #1b263b18}
.sbox i{color:#087f8c;font-size:18px}
.sbox input{border:0;outline:0;width:100%;padding:15px 12px;font-family:inherit;font-size:16px;background:none}
.container{max-width:1100px;margin:auto;padding:0 18px 50px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.head h2{font-size:21px;font-weight:900}
.count{background:#e0f4f4;color:#087f8c;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 6px 20px #1b263b0f;border-top:4px solid #087f8c;transition:.3s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-5px);box-shadow:0 12px 28px #1b263b1c}
.ic{width:54px;height:54px;border-radius:15px;background:#e4f5f5;color:#087f8c;display:grid;place-items:center;font-size:24px;margin-bottom:14px}
.num{color:#087f8c;font-size:12px;font-weight:900;direction:ltr;text-align:right}
.card h3{font-size:19px;font-weight:800;margin:6px 0;direction:ltr;text-align:right}
.card .ar{font-size:16px;color:#334155;font-weight:700}
.card p{color:#64748b;font-size:14px;line-height:1.9;margin-top:8px;flex:1}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid #edf0f4}
.foot span{color:#64748b;font-size:12px}
.open{background:#087f8c;color:#fff;text-decoration:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:800;white-space:nowrap}
.open:hover{background:#065f69}
.msg{text-align:center;padding:36px;color:#64748b;font-size:15px}
footer{background:#1b263b;color:#aeb9ca;text-align:center;padding:24px 12px;font-size:12px;direction:ltr;line-height:2}
.dev{font-size:10px;opacity:.65;margin-top:6px}
@media(max-width:480px){.hero h1{font-size:25px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="hero">
  <div class="top">
    <div class="brand">Nursing Practical Hub<small>PORT SAID UNIVERSITY | FACULTY OF NURSING</small></div>
    <a href="index.html" class="home"><i class="fa-solid fa-house"></i> الرئيسية</a>
  </div>
  <h1>المحاضرات التعليمية</h1>
  <p>اختار المحاضرة اللي عايز تذاكرها وابدأ اتدرب عملي.</p>
</header>

<div class="search"><div class="sbox"><i class="fa-solid fa-magnifying-glass"></i><input id="q" placeholder="دوّر على محاضرة..."></div></div>

<main class="container">
  <div class="head"><h2><i class="fa-solid fa-book-open" style="color:#087f8c"></i> قائمة المحاضرات</h2><span class="count" id="count">0 محاضرات</span></div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg"><i class="fa-solid fa-spinner fa-spin"></i> ثواني وجاي...</div>
</main>

<footer>
  Nursing Practical Hub<br>Faculty of Nursing – Port Said University
  <div class="dev">تم تطويره بواسطة Abdelrhman Wael</div>
</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzAkny0ZeMMNTDTxx9Tjw5dvXQO-oe_K1TyYrRjSnkt5acZXD1bgYZFU4E7ODl42QDZpQ/exec";
const CK = "NPH_PUB_V1";
const ICONS = ["fa-book-medical","fa-user-nurse","fa-heart-pulse","fa-droplet","fa-stethoscope","fa-syringe","fa-hand-holding-medical","fa-notes-medical"];
let lectures = [], loaded = false, failed = false;

function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}

function render(){
  const grid = document.getElementById("grid"); grid.innerHTML = "";
  const f = document.getElementById("q").value.toLowerCase().trim();
  let n = 0;
  lectures.forEach((l,i) => {
    const hay = [l.title,l.titleAr,l.subject,l.level,l.description].join(" ").toLowerCase();
    if (!hay.includes(f)) return;
    n++;
    const c = el("div","card");
    const ic = el("div","ic"); ic.appendChild(el("i","fa-solid "+ICONS[i%ICONS.length]));
    c.append(ic, el("div","num","LECTURE "+String(i+1).padStart(2,"0")), el("h3","",l.title));
    if (l.titleAr) c.appendChild(el("div","ar",l.titleAr));
    c.appendChild(el("p","",l.description || (l.subject+" - "+l.level)));
    const ft = el("div","foot"); ft.appendChild(el("span","",l.subject));
    const a = el("a","open","افتح المحاضرة "); a.href = "Lecture.html?id="+encodeURIComponent(l.id);
    a.appendChild(el("i","fa-solid fa-arrow-left")); ft.appendChild(a);
    c.appendChild(ft); grid.appendChild(c);
  });
  document.getElementById("count").textContent = n+" محاضرات";
  const m = document.getElementById("msg");
  if (!loaded) { m.style.display = "block"; return; }
  m.innerHTML = "";
  m.textContent = failed && !lectures.length ? "مقدرناش نحمّل المحاضرات. اتأكد من النت وجرّب تاني."
    : (n ? "" : (lectures.length ? "مفيش نتايج مطابقة للبحث." : "مفيش محاضرات منشورة دلوقتي."));
  m.style.display = n ? "none" : "block";
}

async function load(){
  try { const c = JSON.parse(localStorage.getItem(CK) || "null"); if (c) { lectures = c; loaded = true; render(); } } catch(e){}
  try {
    const data = await (await fetch(API_URL)).json();
    if (!data.ok) throw new Error(data.error);
    lectures = data.lectures || [];
    try { localStorage.setItem(CK,JSON.stringify(lectures)); } catch(e){}
  } catch(e){ failed = true; }
  loaded = true; render();
}
document.getElementById("q").addEventListener("input",render);
load();
</script>
</body>
</html>
