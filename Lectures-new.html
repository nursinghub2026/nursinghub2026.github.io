<style>
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
.lc{position:relative;background:#fff;border-radius:28px;overflow:hidden;box-shadow:var(--sh);transition:.3s;display:flex;flex-direction:column;border:1px solid rgba(13,34,56,.05)}
.lc:hover{transform:translateY(-7px);box-shadow:var(--sh2)}
.band{position:relative;height:118px;background:linear-gradient(135deg,var(--ac),#0d2238);overflow:hidden}
.band::before{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);top:-80px;left:-40px}
.band .no{position:absolute;left:18px;bottom:-16px;font-size:92px;font-weight:900;color:rgba(255,255,255,.16);line-height:1;direction:ltr}
.band .ico{position:absolute;right:20px;top:22px;width:62px;height:62px;border-radius:20px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;font-size:26px;color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.bd{padding:20px;display:flex;flex-direction:column;flex:1}
.en{font-size:12px;font-weight:900;color:var(--ac);direction:ltr;text-align:right;letter-spacing:.5px}
.lc h3{font-size:19px;font-weight:900;line-height:1.5;margin-top:2px}
.lc .t2{font-size:14px;color:var(--mut);direction:ltr;text-align:right;font-weight:700;margin-top:2px}
.ds{color:var(--mut);font-size:13.5px;line-height:1.95;margin-top:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mt{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.sts div{text-align:center;background:var(--acs);border-radius:14px;padding:8px 4px}
.sts b{display:block;font-size:17px;color:var(--ac);font-weight:900;line-height:1.2}.sts small{font-size:10.5px;color:var(--mut);font-weight:700}
.lc .btn{margin-top:16px;width:100%}
.lec-extras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px;margin-bottom:16px}
.theory .lc .bd>.btn{margin-top:auto}
.lec-extras[hidden]{display:none}
.lec-extra-chip{text-align:center;background:var(--acs);border:1px solid transparent;border-radius:14px;padding:9px 4px;color:var(--ac);min-height:62px;transition:border-color .2s,background .2s}
.lec-extra-chip b{display:block;font-size:17px;font-weight:900;line-height:1.3}
.lec-extra-chip small{font-size:10.5px;color:var(--mut);font-weight:700;white-space:nowrap}
.lec-extra-chip small i{font-size:10px;color:var(--ac);margin-inline-end:2px}
a.lec-extra-chip:hover{border-color:var(--ac)}
.lec-extra-chip.is-empty{background:var(--acs);opacity:.66}
.lec-extra-chip:focus-visible,.lec-extra-retry:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.lec-extra-status{grid-column:1/-1;color:var(--mut);font-size:10px;padding:4px;text-align:center}
.lec-extra-retry{grid-column:1/-1;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ac);font:700 11px inherit;min-height:36px;cursor:pointer}

</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="stylesheet" href="mobile.css"><script src="theme.js"></script><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="luxe-student.css?v=1795864316"></head><body>
<div class="ph"><div class="k" id="pk"></div><h1 id="pt"></h1><p id="ps"></p></div>
<nav class="track-switch" aria-label="نوع المحاضرات"><a href="Lectures.html?track=theory" data-track="theory">النظري</a><a href="Lectures.html?track=practical" data-track="practical">العملي</a></nav>
<div class="sr"><div class="sb"><i class="fa-solid fa-magnifying-glass"></i><input id="q" placeholder="دوّر على محاضرة..."></div></div>
<main class="wrap" style="padding-top:0">
  <div class="hd"><div class="sect" style="margin:0"><i class="fa-solid fa-layer-group"></i><div id="ht"></div></div><span class="pill" id="cnt">0</span></div>

  <div class="empty hidden" id="msg"></div>
</main>
<script src="nav.js"></script><script src="luxe-student.js?v=1795864316"></script><script src="notification-inbox.js" defer></script>
<script src="progress.js"></script><script src="auth.js"></script>

<script>
const CK="NPH_PUB_V1",ICONS=["fa-book-medical","fa-user-nurse","fa-heart-pulse","fa-droplet","fa-stethoscope","fa-syringe","fa-hand-holding-medical","fa-notes-medical"];
const th=new URLSearchParams(location.search).get("track")==="theory",TRACK=th?"theory":"practical";
const tk=l=>l.track==="theory"?"theory":"practical";
const $=i=>document.getElementById(i);
let L=[],loaded=false,failed=false;
if(th)document.body.classList.add("theory");
$("pk").append(ic(th?"fa-book-open":"fa-hand-holding-medical")," "+(th?"THEORY":"PRACTICAL"));
$("pt").textContent=th?"المحاضرات النظرية":"المحاضرات العملية";
$("ps").textContent=th?"شرح وملخصات وكويزات المحاضرات النظرية في أساسيات التمريض.":"اختار المحاضرة اللي عايز تذاكرها وابدأ اتدرب عملي.";
$("ht").textContent=th?"قائمة المحاضرات النظرية":"قائمة المحاضرات العملية";
document.title=(th?"Theory":"Practical")+" | FOUNDATIONS";
const LAB=th?[["explanation","شرح"],["quizzes","كويز"]]:[["explanation","شرح"],["skills","مهارات"],["checklists","شيك ليست"],["quizzes","كويز"]];
function render(){
  const g=$("gr");g.innerHTML="";const f=$("q").value.toLowerCase().trim();
  const mine=L.filter(l=>tk(l)===TRACK);let n=0;
  mine.forEach((l,i)=>{
    if(![l.title,l.titleAr,l.subject,l.level,l.description].join(" ").toLowerCase().includes(f))return;n++;
    const c=(k)=>((l.sections&&l.sections[k])||[]).length;
    const authed=window.NPHAuth&&NPHAuth.isLoggedIn();
    const p=authed?NPH.lectureProgress(l):{done:0,total:0,pct:0};
    const extra=th?h("div",{class:"lec-extras","aria-label":"إضافات المحاضرة"}):null;
    g.appendChild(h("div",{class:"lc rv"},
      h("div",{class:"band"},(p.total&&p.pct===100)?h("span",{class:"pdonechip"},ic("fa-check")," خلصتها"):null,h("div",{class:"no"},String(i+1).padStart(2,"0")),h("div",{class:"ico"},ic(ICONS[i%ICONS.length]))),
      h("div",{class:"bd"},
        h("div",{class:"en"},"LECTURE "+String(i+1).padStart(2,"0")),
        h("h3",null,l.titleAr||l.title),l.titleAr?h("div",{class:"t2"},l.title):null,
        h("p",{class:"ds"},l.description||(l.subject+" - "+l.level)),
        h("div",{class:"mt"},h("span",{class:"pill"},l.subject),h("span",{class:"pill gray"},l.level)),
        h("div",{class:"sts"},LAB.map(x=>h("div",null,h("b",null,String(c(x[0]))),h("small",null,x[1])))),
        extra,
        p.total?h("div",{class:"pmini"},h("div",{class:"pbar sm"},h("i",{style:"width:"+p.pct+"%"})),h("span",{class:"ppct"},p.pct+"%")):null,
        h("a",{class:"btn",href:"Lecture.html?id="+encodeURIComponent(l.id)},"افتح المحاضرة ",ic("fa-arrow-left")))));if(extra)NPHExtraCounts.mount(extra,l.id)});
  $("cnt").textContent=n+" محاضرة";
  const m=$("msg");
  if(!loaded){return}
  if(n){m.classList.add("hidden");return}
  m.classList.remove("hidden");m.textContent=failed&&!L.length?"مقدرناش نحمّل المحاضرات. اتأكد من النت وجرّب تاني.":(mine.length?"مفيش نتايج مطابقة للبحث.":"مفيش محاضرات منشورة دلوقتي.")}
async function load(){
  try{const c=JSON.parse(localStorage.getItem(CK)||"null");if(c){L=c;loaded=true;render()}}catch(e){}
  try{const d=await(await fetch(API)).json();if(!d.ok)throw new Error(d.error);L=d.lectures||[];try{localStorage.setItem(CK,JSON.stringify(L))}catch(e){}}catch(e){failed=true}
  loaded=true;render()}
$("q").addEventListener("input",render);document.querySelectorAll("[data-track]").forEach(a=>{if(a.dataset.track===(new URLSearchParams(location.search).get("track")||"practical"))a.setAttribute("aria-current","page")});load();
</script><script src="firebase-config.js"></script><script src="push.js" defer></script></body></html>
